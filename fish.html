  warm.type='lowshelf';warm.frequency.value=250;warm.gain.value=2;air.type='highshelf';air.frequency.value=6000;air.gain.value=2;
  dl.delayTime.value=0.09;fb.gain.value=0.18;wet.gain.value=0.1;lp.type='lowpass';lp.frequency.value=2500;
  inp.connect(warm).connect(air);air.connect(SND.master);air.connect(dl);dl.connect(lp).connect(fb).connect(dl);lp.connect(wet).connect(SND.master);return MC.pa=inp}
function mcChime(){const c=SND.ctx,t0=c.currentTime;[[659,0],[988,0.16]].forEach(([f,d])=>{for(const [m,v] of [[1,0.35],[4,0.06]]){const o=c.createOscillator(),gn=c.createGain();o.type='sine';o.frequency.value=f*m;gn.gain.setValueAtTime(0.0001,t0+d);gn.gain.exponentialRampToValueAtTime(v,t0+d+0.01);gn.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.6);o.connect(gn).connect(mcPA());o.start(t0+d);o.stop(t0+d+0.65)}});return new Promise(r=>setTimeout(r,650))}
function mcSay(t,o={}){if(PRESIM||(!CFG.mc&&!o.pri))return;if(o.n!=null&&!clean(o.n))return;const q=MC.q;if(q.length>=10){const i=q.findIndex(x=>!x.pri);if(i<0)return;q.splice(i,1)}
  const it={t,n:o.n,f:o.f,pri:o.pri||0,chime:o.chime,w:o.w,at:performance.now()/1000,ttl:o.ttl||30};if(it.pri){const i=q.findIndex(x=>!x.pri);q.splice(i<0?q.length:i,0,it)}else q.push(it);if(!MC.busy)mcNext()}
async function mcNext(){const c=SND.ctx,now=()=>performance.now()/1000;MC.q=MC.q.filter(x=>now()-x.at<x.ttl);const a=MC.q.shift();if(!a){MC.busy=false;return}
  if(!c||c.state!=='running'){MC.busy=false;MC.q.length=0;return}MC.busy=true;
  const url='/mc?v=f&t='+encodeURIComponent(a.t)+(a.n!=null?'&n='+encodeURIComponent(a.n):'')+(a.f?'&f='+encodeURIComponent(a.f):'');
  const bufP=fetch(url,{cache:'no-cache'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>b?c.decodeAudioData(b):null).catch(()=>null);
  if(MUS.bus)MUS.bus.gain.setTargetAtTime(MUS.vol*0.4,c.currentTime,0.1);if(a.chime)await mcChime();
  const buf=await Promise.race([bufP,new Promise(r=>setTimeout(()=>r(null),7000))]);
  if(buf)await new Promise(res=>{const s=c.createBufferSource(),gn=c.createGain();s.buffer=buf;gn.gain.value=0.95;s.connect(gn).connect(mcPA());s.onended=res;s.start();setTimeout(res,(buf.duration+2)*1000)});
  MC.lastEnd=NOW;MC.said=(MC.said||0)+(buf?1:0);if(!MC.q.length&&MUS.bus)MUS.bus.gain.setTargetAtTime(MUS.vol,c.currentTime,0.6);setTimeout(mcNext,MC.q.length?250:500)}

  if(SHOWSAFE){g.fillStyle='rgba(255,0,0,.25)';g.fillRect(0,0,W,SAFE_T);g.fillRect(0,SAFE_B,W,H-SAFE_B)}}

// ---------- คำสั่งจากหน้า /studio และรายงานสถานะ ----------
function control(c){const a=c.arg;if(c.cmd==='npc')NPC.level=clamp(+a|0,0,2);else if(c.cmd==='legend'){EV.st='off';EV.next=0;legendStart()}else if(c.cmd==='frenzy')frenzy();
  else if(c.cmd==='say'&&a&&clean(a))mcSay(String(a).slice(0,150),{pri:1,chime:1,ttl:60});else if(c.cmd==='reload')location.reload();
  else if(c.cmd==='musvol'){MUS.vol=clamp(+a||0,0,1);if(MUS.bus)MUS.bus.gain.value=MUS.vol}else if(c.cmd==='mc')CFG.mc=+a?1:0;else if(c.cmd==='welcome')CFG.welcome=+a?1:0;
  else if(c.cmd==='mcgap')CFG.gap=clamp(+a||15,6,120);else if(c.cmd==='legendgap'){CFG.legend=clamp(+a||6,2,30);EV.next=Math.min(EV.next,NOW+CFG.legend*60)}else if(c.cmd==='cycle')CFG.cycle=clamp(+a||12,4,60);sendState()}
let wsRef=null;
function sendState(){if(!wsRef||wsRef.readyState!==1)return;wsRef.send(JSON.stringify({type:'state',game:'fish',state:'play',players:Object.values(P).filter(p=>!p.npc&&NOW-p.last<60).length,fishers:fishers.filter(F=>!F.p.npc).length,
  catches:stats.catches,legends:stats.legends,hearts:liveHearts,legendIn:EV.st==='off'?Math.max(0,Math.round(EV.next-NOW)):0,phase:DAY.cur.n,npc:NPC.level,fps:Math.round(fpsNow),quality,live:live.state,audio:SND.ctx?SND.ctx.state:'none',mcSaid:MC.said||0}))}
setInterval(sendState,1000);
fetch('/record/fish').then(r=>r.json()).then(d=>{if(d.best)record.best=d.best}).catch(()=>{});

// ---------- คนดูจำลอง / โหมดทดสอบ ----------
const FAKE=['ploy_99','mek.k','nongbeam','jaa_jaa','tonkla','minnie.th','pond2002','fern.f'],FAKE2=['somchai','น้องมายด์','beer_bkk','kwankwan','aomsin','พี่ต้น'];let simT={c:1,l:0,g:12,j:3};
function sim(){const act=Object.values(P).filter(p=>!p.npc&&NOW-p.last<25);if(NOW>simT.c){simT.c=NOW+rnd(2,5);comment(pick(FAKE),pick(['ตกปลา','ขอตัวใหญ่','555','สวัสดี','ลุ้นปลาบึก']))}
  if(NOW>simT.j){simT.j=NOW+rnd(7,12);joined(pick(FAKE2))}if(NOW>simT.l){simT.l=NOW+0.5;if(act.length&&Math.random()<0.7)like(pick(act).name,rnd(1,6)|0)}
  if(NOW>simT.g){simT.g=NOW+rnd(14,22);if(act.length)gift(pick(act).name,pick([1,1,5,30,30,100]))}}
let crowdOn=Q.has('demo');
if(Q.has('test')){const me='ผู้ทดสอบ',bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.92);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 15px Kanit,Tahoma;z-index:9';
  const btn=(l,fn,bg='#3a3f48')=>{const b=document.createElement('button');b.textContent=l;b.style.cssText=`background:${bg};color:#fff;border:0;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer`;b.onclick=e=>{e.stopPropagation();SND.ctx&&SND.ctx.resume();fn()};bar.appendChild(b);return b};
  const inp=document.createElement('input');inp.value='ตกปลา';inp.maxLength=34;inp.style.cssText='font:inherit;padding:7px 9px;border-radius:8px;border:0;width:150px';inp.onpointerdown=e=>e.stopPropagation();inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')comment(me,inp.value)};bar.appendChild(inp);
  btn('พิมพ์ (ตกปลา)',()=>comment(me,inp.value),'#4a7a3a');btn('♥ x10',()=>like(me,10),'#c0394b');btn('♥ x200',()=>like(me,200),'#c0394b');
  btn('กุหลาบ 1',()=>gift(me,1,'5655'),'#8a5a2a');btn('โดนัท 30',()=>gift(me,30,'5879'),'#8a5a2a');btn('มือหัวใจ 100',()=>gift(me,100,'5660'),'#8a5a2a');btn('คอร์กี้ 299',()=>gift(me,299,'6267'),'#8a5a2a');
  btn('ปลาตำนานโผล่',()=>control({cmd:'legend'}),'#8a6a1a');btn('ถามวิธีเล่น',()=>comment('คนใหม่','เล่นยังไงคะ'),'#3a5a7a');btn('คนเข้าห้อง',()=>joined(pick(FAKE2)+' '+(greeted.size+1)),'#3a5a7a');
  btn('เวลา +3 นาที',()=>{NOW+=180},'#3a5a7a');const cb=btn('คนดูจำลอง: ปิด',()=>{crowdOn=!crowdOn;cb.textContent='คนดูจำลอง: '+(crowdOn?'เปิด':'ปิด')});document.body.appendChild(bar)}
Object.assign(window,{comment,like,gift,follow,joined,control,P,_t:s=>{NOW+=s},dbg:()=>({sounds:Object.keys(SND.buf).sort().join(' '),fishers:fishers.length,real:fishers.filter(F=>!F.p.npc).length,states:fishers.map(F=>F.st).join(','),cards:cards.length,catches:stats.catches,ev:EV.st,phase:DAY.cur.n,fps:Math.round(fpsNow),calls:renderer.info.render.calls,tris:renderer.info.render.triangles,mc:MC.said||0,audio:SND.ctx&&SND.ctx.state})});

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=clean(name)?name:'ผู้ใช้',i=2;const base=n;while(used[n]&&used[n]!==id)n=`${base}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){if(ev.type==='status'){live={...live,...ev};return}if(ev.type==='control'){control(ev);return}const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);else if(ev.type==='like')like(name,ev.count||1,ev.pic);else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic,ev.gift,ev.count||1);else if(ev.type==='follow')follow(name,ev.pic,ev.repeat);else if(ev.type==='join')joined(name,ev.pic)}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);wsRef=ws;ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}

// ---------- loop ----------
let last=performance.now(),errN=0,fpsN=0,fpsT0=performance.now(),quality=0,fpsNow=0,lowN=0;
function fpsGuard(){fpsN++;const now=performance.now();if(now-fpsT0<2000)return;fpsNow=fpsN*1000/(now-fpsT0);fpsN=0;fpsT0=now;
  if(honor||NOW<10||document.visibilityState!=='visible'){lowN=0;return}lowN=fpsNow<34?lowN+1:0;
  if(lowN>=3&&quality<2){lowN=0;quality++;if(quality===1){renderer.setPixelRatio(0.75);composer.setPixelRatio(0.75)}else bloom.enabled=false}}
function loop(t){requestAnimationFrame(loop);const dt=clamp((t-last)/1000,0,0.05);last=t;NOW+=dt;
  try{if(crowdOn)sim();attract(dt);updScene(dt);musicTick();fpsGuard();updCamera(dt);renderer.info.reset();composer.render();drawOverlay()}catch(e){if(errN++<5)console.error(e)}}
// อุ่นเครื่อง: วาดปลาทุกชนิดกับคนตกปลาหนึ่งรอบก่อนเริ่ม กันกระตุกตอนของโผล่ครั้งแรก
function prewarm(){const tmp=[];try{FISH.forEach((f,i)=>{const m=fishMesh(f);m.position.set(-20+i*3,5,-30);scene.add(m);tmp.push(m)});const fz=makeFisher();fz.g.position.set(0,2,-20);scene.add(fz.g);tmp.push(fz.g);
  updScene(0.016);composer.render()}catch(e){console.error('prewarm',e)}tmp.forEach(o=>scene.remove(o))}
document.fonts.load('700 40px Kanit').finally(()=>{prewarm();last=performance.now();requestAnimationFrame(loop)});
