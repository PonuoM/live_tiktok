const map=document.createElement('canvas');map.width=W;map.height=H;const m=map.getContext('2d');
function R(x,y,w,h,c,ctx=m){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function floor(x0,y0,x1,y1,a,b){for(let y=sy(y1);y<sy(y0);y+=6)for(let x=sx(x0);x<sx(x1);x+=6)R(x,y,Math.min(6,sx(x1)-x),Math.min(6,sy(y0)-y),((x/6+y/6)|0)%2?a:b)}
function box(x0,y0,x1,y1,hm,top,front,edge){
  const X0=sx(x0),X1=sx(x1),Y0=sy(y0),Y1=sy(y1),h=Math.round(hm*HZ);
  R(X0,Y1-h,X1-X0,Y0-Y1,top);R(X0,Y0-h,X1-X0,h,front);R(X0,Y0-h,X1-X0,1,edge||'#0006');
  return {X0,X1,Y0,Y1,h};
}

  for(let x=sx(0.3);x<sx(7.2)&&x<sx(6.2);x+=22)R(x,sy(11)-14,18,6,'#06090b'); // high windows

  // doors on back wall

  R(sx(9.2),sy(11)-14,sx(10.2)-sx(9.2),14,'#d8e2e6');R(sx(9.2),sy(11)-14,sx(10.2)-sx(9.2),2,'#9fb3b8'); // cold door (white)
  // front wall: glass + door
  R(sx(0),sy(0)-3,sx(9)-sx(0),5,'#20282c');

  // wall shelf west + gondolas
  const goods=['#b0413a','#d2b06a','#4f8a60','#6a8fb8','#d8d6cc','#c46f2d'];
  function shelf(x0,y0,x1,y1,hm){const b=box(x0,y0,x1,y1,hm,'#9aa6ab','#4a565c');
    for(let y=b.Y1-b.h+2;y<b.Y0-b.h-1;y+=3)for(let x=b.X0+1;x<b.X1-1;x+=3)R(x,y,2,2,goods[((x*7+y*3)>>2)%6]);

  // fridge wall east (glass doors facing west)

  // back wall behind staff
  const pr=box(0.3,10.5,1.9,10.95,1.8,'#7a7f82','#3b4043');for(let x=pr.X0+2;x<pr.X1-2;x+=5)for(let y=pr.Y1-pr.h+1;y<pr.Y0-2;y+=5)R(x,y,4,4,'#b01e1e');

  const bf=box(4.6,10.5,6,10.95,1.9,'#a9c4cc','#2c4a54');for(let x=bf.X0+2;x<bf.X1-2;x+=3)for(let y=bf.Y0-bf.h+2;y<bf.Y0-2;y+=4)R(x,y,2,3,pick(['#e04a3a','#58b0e0','#7fd07a']));
  // scanner on wall between fridge + stock door
  R(sx(7.2),sy(11)-12,5,6,'#111');R(sx(7.2)+1,sy(11)-11,3,2,'#3f6');

function drawCounter(ctx){ // drawn after staff, before customers
  const X0=sx(0.6),X1=sx(7.4),Y0=sy(8.4),Y1=sy(9),h=9;
  R(X0,Y1-h,X1-X0,Y0-Y1,'#aeb8bc',ctx);R(X0,Y0-h,X1-X0,h,'#5d6a70',ctx);R(X0,Y0-h,X1-X0,1,'#d4dadc',ctx);

  R(sx(1.2),sy(8.67)-h-4,3,4,'#d33',ctx);

const TUBES=[];for(const x of [1.6,4.5,7.4])for(const y of [2,5,8,10])TUBES.push([x,y]);
drawMap();

// ---------- sprites ----------
const FRONT=["...kkkkkk...","..khhhhhhk..",".khhhhhhhhk.",".khsssssshk.",".kssessessk.",".kssssssssk.","..kssssssk..","...kkkkkk...","..kcccccck..",".kcccccccck.","ksccccccccsk","ksccccccccsk",".kcccccccck.",".kppppppppk.",".kppppppppk."];
const BACK=FRONT.map((r,i)=>i>=3&&i<=5?".khhhhhhhhk.":i==6?"..khhhhhhk..":r);
const SIDE=["...kkkkk....","..khhhhhk...",".khhhhhhhk..",".khhhsssssk.",".khhssssesk.",".khsssssssk.","..kssssssk..","...kkkkkk...","...kcccck...","..kcccccck..","..kcccscck..","..kcccscck..","..kcccccck..","..kppppppk..","..kppppppk.."];
const LEGF=[[".kppk..kppk.",".kppk..kppk.",".kkkk..kkkk."],[".kppk..kpk..",".kppk..kkk..",".kkkk......."],[".kppk..kppk.",".kppk..kppk.",".kkkk..kkkk."],["..kpk..kppk.","..kkk..kppk.",".......kkkk."]];
const LEGS=[["...kppppk...","...kppppk...","...kkkkkk..."],["..kpk..kpk..",".kpk....kpk.",".kk......kk."],["...kppppk...","...kppppk...","...kkkkkk..."],["...kpkkpk...","...kpkkpk...","...kkkkkk..."]];
function paint(rows,pal,long,mirror){
  const c=document.createElement('canvas');c.width=12;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,j)=>{let a=[...r];if(long&&j>=4&&j<=10){if(a[1]==='k'||a[1]==='s'||a[1]==='c')a[1]='h';if(a[10]==='k'||a[10]==='s'||a[10]==='c')a[10]='h'}
    if(mirror)a.reverse();a.forEach((ch,i)=>{if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1)}})});
  return c;
}
function makeSet(pal,long){
  const s={down:[],up:[],right:[],left:[]};
  for(let f=0;f<4;f++){s.down.push(paint(FRONT.concat(LEGF[f]),pal,long));s.up.push(paint(BACK.concat(LEGF[f]),pal,long));
    s.right.push(paint(SIDE.concat(LEGS[f]),pal,long));s.left.push(paint(SIDE.concat(LEGS[f]),pal,long,true));}
  return s;
}
const SKIN=['#f0c8a8','#e0b08a','#c98e64','#a8714c'],HAIR=['#1a1410','#3b2a1e','#6b4a2a','#8a8a8a','#c8a040','#7a2a2a','#2a3a6a'];
const SHIRT=['#2e6db0','#c0392b','#5c8a4a','#e0e0e0','#e0a030','#8a4ab0','#2aa0a0','#d06090','#404850'],PANTS=['#2b2b38','#3a3a3a','#1f3a5a','#5a4630','#6a6a72'];
const randPal=()=>({k:'#14161a',e:'#14161a',h:pick(HAIR),s:pick(SKIN),c:pick(SHIRT),p:pick(PANTS)});
const SETS={
  nhing:makeSet({k:'#14161a',e:'#14161a',h:'#14161a',s:'#e0b08a',c:'#2f9a5a',p:'#2b2b38'}),
  shadow:makeSet({k:'#000',e:'#ff2020',h:'#000',s:'#050505',c:'#050505',p:'#050505'}),
  dancer:makeSet({k:'#2a0a10',e:'#14161a',h:'#d4a72c',s:'#e8dcd0',c:'#7a1f3a',p:'#d4a72c'},true),
  boss:makeSet({k:'#000',e:'#ff2020',h:'#050505',s:'#c8d4d8',c:'#e8eef0',p:'#e8eef0'},true),
};

// ---------- entities ----------
const NAMEPOOL=['Ammmmm','วิ','olik','น้องข้าว888','Pumin','แม่น้องจันปัน','tubby','ต้นกล้า','ฟ้าใส','Nong.Mild','บีม_99','ปาล์ม','Jaa','กุ้ง','mook.ky','น้ำหวาน','KenZ','ป้าแดง','oatmeal','ตูน','Nut2003','ใบเตย','ภูมิ','Fern','แบงค์','อิ๊ก','zeze','ลุงหนวด','จูน','mimi','Tar_T','ก้อย','เพชร','pp.krub','มายด์','คิม','โฟกัส','อาร์ม','บอส','แพรวา','Gunn','นาย','ดิว','เอิร์ธ','มิว','ปอนด์','ไอซ์','เบนซ์'];
let avatars=[], ghosts=[], banners=[], feed=[], parts=[];
let light=1, pulse=78, night=1, likes=0, dead=[], scores={}, event=null, nextEvt=0, frozenUntil=0, cctvUntil=0, musicUntil=0, flashRed=0, shake=0, morning=0;
const CORR=[1.5,4.5,7.4], CROSS=[1.6,7.7];
function nearest(a,v){return a.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p)}
function randTarget(){
  if(Math.random()<0.6){const cx=pick(CORR);return [cx+rnd(cx===4.5?-1:-0.25,cx===4.5?1:0.25),rnd(1.3,7.9)]}
  const cy=pick(CROSS);return [rnd(0.9,8),cy+rnd(-0.4,0.4)];
}
function route(e,tx,ty){const a=nearest(CROSS,e.y),k=nearest(CORR,e.x),b=nearest(CROSS,ty);
  e.path=[[e.x,a],[k,a],[k,b],[tx,b],[tx,ty]];}
function join(name){
  if(avatars.some(a=>a.name===name&&a.alive))return;
  const pal=randPal(), long=Math.random()<0.4;
  const a={name,set:makeSet(pal,long),x:rnd(4.1,4.9),y:-0.3,dir:'up',alive:true,path:[[4.5,1.6]],wait:0,flash:0,shield:0,kind:'avatar'};
  avatars.push(a);addFeed(`${name} เข้ากะ`,'#9fe0ff');
}
function addFeed(s,col){feed.unshift({s,col,t:NOW});if(feed.length>7)feed.pop()}
function banner(s,col='#fff',sub=''){if(banners.filter(b=>b.t>NOW).length>=3)return;banners.push({s,col,sub,t:NOW+banners.reduce((p,b)=>Math.max(p,b.t+2.2-NOW),0)})}
function step(e,sp,dt){
  if(!e.path||!e.path.length)return true;
  const [tx,ty]=e.path[0],dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
  if(d<0.05){e.path.shift();return !e.path.length}
  const s=Math.min(d,sp*dt);e.x+=dx/d*s;e.y+=dy/d*s;
  e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'up':'down');e.moving=true;return false;
}
function grab(ghost,target){ghost.target=target;target.targeted=true;}
function kill(a,by){a.alive=false;a.carried=by;dead.push(a);pulse=Math.min(170,pulse+14);flashRed=0.5;shake=14;
  banner(`ผีพา ${a.name} เข้าห้องเย็น`,'#ff5a5a','พิมพ์อะไรก็ได้เพื่อกลับเข้ากะ');}
function alive(){return avatars.filter(a=>a.alive)}
function protectedA(a){return a.flash>NOW||a.shield>NOW}

// ---------- events ----------
const EVENTS={
  impostor(){const isGhost=Math.random()<0.55;
    const e={kind:'imp',ghost:isGhost,name:'ลูกค้า',set:makeSet(isGhost?{...randPal(),s:'#cfdade'}:randPal(),Math.random()<0.4),x:4.5,y:-0.3,dir:'up',path:[[4.5,1.6],[4.4,7.9]],noShadow:isGhost};
    const ev={type:'imp',e,phase:'walk',t:NOW,vote:[0,0],line:pick(['ขอบุหรี่ซองนึงครับ','มีน้ำแข็งไหมคะ','ร้านปิดกี่โมงครับ','ขอยืมห้องน้ำหน่อย','ผมมาซื้อของให้แม่','เห็นเพื่อนผมไหม','ขอถุงเพิ่มใบนึงค่ะ'])};
    ghosts.push(e);banner('มีลูกค้าเดินเข้าร้าน','#ffd34d','สังเกตดีๆ ว่าเป็นคนหรือเปล่า');return ev;},
  blackout(){const s={kind:'hunter',set:SETS.shadow,x:9.7,y:11.2,dir:'down',path:[[9.7,10.6]],speed:1.5,big:1.2};ghosts.push(s);
    banner('ไฟในร้านกำลังดับ!','#ff5a5a','กดไลค์หรือพิมพ์รัวๆ ให้ถึงเป้า ไฟจะกลับมา');return {type:'blackout',e:s,t:NOW,goal:goalFor(1800,25),got:0,dur:18};},

    banner('นางรำมาแล้ว ห้ามมอง','#d4a72c','พิมพ์ "ไม่มอง" เท่านั้น ใครพิมพ์อย่างอื่นโดนพาไป');return {type:'dancer',e:s,t:NOW,dur:12,victims:[]};},

};
// เป้าไลค์ลดตามจำนวนคนในร้าน ไลฟ์คนน้อยจะได้ไม่แพ้ทุกคืน (โหมดจำลองใช้เป้าเต็ม)
function goalFor(full,per){if(DEMO)return full;const n=Math.max(1,alive().length);return Math.max(per*3,Math.min(full,Math.round(n*per/10)*10))}
const PLAN=[[4,'impostor'],[38,'blackout'],[68,'impostor'],[96,'dancer'],[122,'impostor'],[150,'boss']];
let planIdx=0, nightStart=0;
const NIGHT=180;

function endEvent(){event=null}
function updateEvent(dt){
  const ev=event; if(!ev)return; const el=NOW-ev.t;
  if(ev.type==='imp'){
    if(ev.phase==='walk'&&!ev.e.path.length){ev.phase='talk';ev.t=NOW;ev.e.dir='up'}
    else if(ev.phase==='talk'&&el>2){ev.phase='vote';ev.t=NOW}
    else if(ev.phase==='vote'&&el>10){
      const said=ev.vote[1]>ev.vote[0], ok=said===ev.e.ghost; ev.phase='res';ev.t=NOW;
      if(ev.e.ghost&&ok){ev.res='จับผีได้!';ev.col='#7fffa0';ev.e.reveal=true;ev.e.fade=NOW;shake=20;
        burst(ev.e.x,ev.e.y,'#e8eef0',30)}
      else if(ev.e.ghost){ev.res='ปล่อยผีเข้าร้าน!';ev.col='#ff4a4a';ev.e.reveal=true;ev.e.kind='hunter';ev.e.speed=1.6;ev.e.quota=3;shake=30;flashRed=0.7;pulse+=30}
      else if(ok){ev.res='คนจริง บริการเรียบร้อย';ev.col='#7fffa0';ev.e.path=[[4.4,1.6],[4.5,-0.6]];ev.e.leave=true}
      else {ev.res='ไล่ลูกค้าจริงไปซะแล้ว ไฟตก';ev.col='#ffb04a';light=Math.max(0.3,light-0.35);ev.e.path=[[4.4,1.6],[4.5,-0.6]];ev.e.leave=true}
    }
    else if(ev.phase==='res'&&el>3)endEvent();
  }
  if(ev.type==='blackout'){
    light=Math.max(0,light-dt*0.35);
    if(ev.got>=ev.goal){banner('ไฟกลับมาแล้ว!','#7fe0ff');light=1;ev.e.path=[[9.7,11.3]];ev.e.flee=true;ev.e.kind='flee';endEvent();return}

// ---------- update ----------
function update(dt){
  if(DEMO)sim();
  const tn=NOW-nightStart;
  if(morning){if(NOW-morning>7){morning=0;night++;nightStart=NOW;planIdx=0;light=1;pulse=78;
      dead.forEach(d=>{avatars=avatars.filter(x=>x!==d)});dead=[];ghosts=[];banner(`คืนที่ ${night} เริ่มแล้ว`,'#9fe0ff','ผีจะมาเร็วขึ้น')}return}
  if(tn>=NIGHT&&!event){morning=NOW;ghosts=[];banner(`06:00 รอดถึงเช้า ${alive().length} คน`,'#ffe28a');return}
  if(!event&&planIdx<PLAN.length&&tn>=PLAN[planIdx][0]){event=EVENTS[PLAN[planIdx][1]]();planIdx++}
  updateEvent(dt);
  if(!event||event.type!=='blackout')light=Math.min(1,light+dt*0.02);
  pulse+=(78-pulse)*dt*0.08;
  const frozen=NOW<frozenUntil;
  for(const a of avatars){a.moving=false;
    if(!a.alive){if(a.carried){a.x=a.carried.x+0.2;a.y=a.carried.y-0.05}continue}
    if(a.targeted)continue;
    if(a.path&&a.path.length)step(a,1.1,dt);
    else if(NOW>a.wait){if(Math.random()<0.5){const[t1,t2]=randTarget();route(a,t1,t2)}else{a.wait=NOW+rnd(1,4);a.dir=pick(['down','down','left','right','up'])}}
  }
  for(const gh of ghosts){gh.moving=false;
    if(gh.fade&&NOW-gh.fade>1.2)gh.gone=true;
    if(frozen&&gh.kind!=='imp')continue;
    if(gh.kind==='hunter'){
      if(gh.carry){ if(step(gh,1.4,dt)){gh.carry.carried=null;gh.carry.hidden=true;gh.carry=null;gh.quota--;
          if(gh.quota<=0){gh.fade=NOW;gh.kind='done'}} continue}
      if(!gh.target||!gh.target.alive||protectedA(gh.target)){
        if(gh.target)gh.target.targeted=false;
        const pool=(gh.list||alive()).filter(a=>a.alive&&!protectedA(a)&&!a.targeted);
        if(!pool.length){gh.fade=gh.fade||NOW;continue}
        pool.sort((p,q)=>Math.hypot(p.x-gh.x,p.y-gh.y)-Math.hypot(q.x-gh.x,q.y-gh.y));grab(gh,pool[0]);}
      gh.path=[[gh.target.x,gh.target.y]];
      if(step(gh,gh.speed||1.5,dt)||Math.hypot(gh.target.x-gh.x,gh.target.y-gh.y)<0.25){
        const v=gh.target;v.targeted=false;kill(v,gh);gh.carry=v;gh.target=null;gh.path=[[9.7,10.7],[9.7,11.3]];}
    } else if(gh.path&&gh.path.length){step(gh,gh.speed||1.0,dt);if(gh.leave&&!gh.path.length)gh.gone=true;if(gh.flee&&!gh.path.length)gh.gone=true}
  }
  ghosts=ghosts.filter(gh=>!gh.gone);
  avatars.forEach(a=>{if(a.say&&NOW-a.sayT>2.5)a.say=null});
  parts=parts.filter(p=>NOW-p.t<p.life);
}

  feed.slice(0,5).forEach((f,i)=>{g.globalAlpha=Math.max(0,1-(NOW-f.t)/7);txt(f.s,40,fy+i*44,28,f.col,'left',500);g.globalAlpha=1});

  // สถานะไลฟ์ (เห็นเฉพาะตอนยังไม่ได้ต่อ) และข้อความชวนตอนร้านว่าง
  if(!DEMO&&live.state!=='live'){const m={connecting:'กำลังต่อไลฟ์...',offline:'รอไลฟ์เริ่ม...',error:'ต่อไลฟ์ไม่ได้ กำลังลองใหม่',server:'ไม่เจอ server.js'}[live.state]||live.state;
    txt(m,1030,fy,28,'#ffb04a','right',500)}
  if(!DEMO&&!alive().length&&!morning){g.globalAlpha=0.75+0.25*Math.sin(NOW*3);panel(90,820,900,230,0.85,'#7fe0ff');
    txt('ร้านยังว่าง',540,912,60,'#7fe0ff','center');txt('พิมพ์อะไรก็ได้ เพื่อเข้ากะเป็นพนักงาน',540,990,38,'#fff','center',500);g.globalAlpha=1}
  // banners
  const b=banners.find(b=>NOW>=b.t&&NOW<b.t+2.2);banners=banners.filter(b=>NOW<b.t+2.2);
  if(b){const k=Math.min(1,(NOW-b.t)*6);g.globalAlpha=k;panel(60,1080,960,b.sub?180:120,0.85,b.col);txt(b.s,540,1160,52,b.col,'center');if(b.sub)txt(b.sub,540,1224,30,'#e8eef0','center',500);g.globalAlpha=1}

  // event panel
  panel(16,ey,1048,eh,0.85,'#ffd34d');
  if(event&&event.type==='imp'&&event.phase==='vote'){
    const left=Math.max(0,10-Math.floor(NOW-event.t));txt(`คนหรือผี? พิมพ์ 1 หรือ 2  (${left})`,540,ey+62,44,'#fff','center');
    const tot=event.vote[0]+event.vote[1]||1,a=event.vote[0]/tot;g.fillStyle='#3a8fe0';g.fillRect(50,ey+86,980*a,58);g.fillStyle='#e03a3a';g.fillRect(50+980*a,ey+86,980*(1-a),58);
    txt(`1 คน ${Math.round(a*100)}%`,70,ey+130,36,'#fff');txt(`2 ผี ${Math.round((1-a)*100)}%`,1010,ey+130,36,'#fff','right');
  } else if(event&&event.type==='imp'&&event.phase==='res'){txt(event.res,540,ey+108,60,event.col,'center')}
  else if(event&&(event.type==='blackout'||event.type==='boss')){
    const left=Math.max(0,Math.ceil(event.dur-(NOW-event.t)));
    txt(event.type==='boss'?`ดันผีใหญ่ออกไป  ${left<999?left+' วิ':''}`:`กดไลค์ให้ไฟกลับมา  ${left<999?left+' วิ':''}`,540,ey+62,42,event.type==='boss'?'#ff6a6a':'#7fe0ff','center');
    segBar(50,ey+86,980,58,event.got/event.goal,event.type==='boss'?'#ff4a4a':'#7fe0ff',24);
    txt(`${Math.min(event.got,event.goal).toLocaleString()} / ${event.goal.toLocaleString()}`,540,ey+130,32,'#fff','center');
  } else if(event&&event.type==='dancer'){
    txt(`พิมพ์ "ไม่มอง"  (${Math.max(0,Math.ceil(event.dur-(NOW-event.t)))})`,540,ey+72,48,'#d4a72c','center');
    txt(`มองไปแล้ว ${event.victims.length} คน`,540,ey+136,36,'#ff8f8f','center');
  } else {
    txt(morning?'รอดถึงเช้า!':'คอมเมนต์อะไรก็ได้ เข้ากะในร้าน',540,ey+64,40,'#fff','center',500);
  }
  // gifts + top
  panel(16,1770,640,140,0.85);
  [['กุหลาบ 1','ไฟฉาย','#ff6a8a'],['ยันต์ 30','ช่วยคนโดนจับ','#ffd34d'],['กล้อง 100','เห็นหน้าจริง','#7fe0ff'],['เพลงร้าน 299','ผีหยุด','#b88aff']].forEach(([a,c,col],i)=>{
    const X=40+(i%2)*310,Y=1822+Math.floor(i/2)*60;txt(a,X,Y,28,col);txt(c,X+300-12,Y,24,'#aab','right',500)});
  panel(670,1770,394,140,0.85);
  txt('เฝ้าร้านคืนนี้',694,1814,28,'#7fe0ff');
  const tp=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,2);
  tp.forEach(([n,v],i)=>{txt(`${i+1}. ${n}`,694,1856+i*40,26,i?'#fff':'#ffd34d','left',500);txt(`${v}`,1040,1856+i*40,26,'#aab','right',500)});
}

// ---------- loop ----------
let last=performance.now();
if(DEMO){for(let i=0;i<14;i++)join(NAMEPOOL[i]);
avatars.forEach(a=>{a.y=rnd(1.4,7.8);a.x=pick(CORR)+rnd(-0.25,0.25);a.path=[];a.dir='down'});}
if(START){const st=START;for(let t=0;t<st;t+=1/30){NOW+=1/30;update(1/30)}}
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000)*SPEED;last=t;NOW+=dt;
  update(dt);shake*=0.88;flashRed*=0.9;
  render();requestAnimationFrame(loop);
}
document.fonts.load(`700 40px Kanit`).finally(()=>requestAnimationFrame(loop));
</script></body></html>
