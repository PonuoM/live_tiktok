// แบบ: peony ลูกกลม, chrys ลูกกลมหางยาวระยิบ, willow ทองย้อยลง, ring วงแหวน, double สองชั้นสองสี, heart รูปหัวใจ (ใช้ตอนหัวใจครบเป้า)
const FW_COL=[[0xff4a70,0xffd0dc],[0xffc030,0xfff2c0],[0x58c8ff,0xe0f6ff],[0x7af07a,0xe8ffd8],[0xc080ff,0xf0e0ff],[0xfff4e0,0xffffff],[0xff8030,0xffe0b0]];

function fwPoints(n){const geo=new THREE.BufferGeometry(),pos=new Float32Array(n*3),col=new Float32Array(n*3);geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));

function burst(x,y,z,type,ci,scale=1,quiet=false){const [h1,h2]=FW_COL[ci%FW_COL.length],v=[];let life=2.5,drag=1.5,grav=3.0,tw=0.2,TR=6;
  const sph=(n,sp,jit=0.12,flag=0)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,b=Math.acos(rnd(-1,1)),s=sp*scale*(1+rnd(-jit,jit));v.push([Math.sin(b)*Math.cos(a)*s,Math.cos(b)*s,Math.sin(b)*Math.sin(a)*s,flag])}};
  if(type==='chrys'){sph(150,12.5,0.04);life=3.1;drag=1.15;tw=0.65;TR=8}
  else if(type==='willow'){sph(110,9.5,0.25);life=4.2;drag=0.85;grav=5.2;tw=0.08;TR=10}
  else if(type==='ring'){const tilt=rnd(0.5,1.2),spin=rnd(0,3.14);for(let i=0;i<72;i++){const a=i/72*6.283,vx=Math.cos(a)*12*scale,vy=Math.sin(a)*12*scale*Math.cos(tilt),vz=Math.sin(a)*12*scale*Math.sin(tilt);v.push([vx*Math.cos(spin)-vz*Math.sin(spin),vy,vx*Math.sin(spin)+vz*Math.cos(spin),0])}sph(46,5,0.2,1)}
  else if(type==='double'){sph(120,13.5,0.04);sph(70,6.5,0.1,1)}
  else if(type==='heart'){for(let i=0;i<120;i++){const t=i/120*6.283,hx=16*Math.pow(Math.sin(t),3),hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);v.push([hx*0.78*scale,(hy*0.78+2)*scale,rnd(-0.5,0.5),0])}sph(36,3.2,0.3,1);life=3.0;drag=2.0;grav=1.0;tw=0.3}
  else sph(170,13);
  const n=v.length,o=fwPoints(n*TR);for(let i=0;i<n*TR;i++){o.pos[i*3]=x;o.pos[i*3+1]=y;o.pos[i*3+2]=z}
  const fl=glowSprite(h1,60*scale,0.85);fl.position.set(x,y,z);fl.material.fog=false;scene.add(fl);
  fireworks.push({...o,v,n,TR,t:NOW,life,drag,grav,tw,c1:new THREE.Color(type==='willow'?0xffc030:h1),c2:new THREE.Color(h2),c3:new THREE.Color(FW_COL[(ci+3)%FW_COL.length][0]),fl,acc:0,crk:type==='chrys'||type==='willow'});
  flashAmt=Math.min(1.3,flashAmt+(quiet?0.2:0.55)*scale);fwSound('fw_boom',quiet?0.22:clamp(0.75*scale,0.3,0.9))}
function rocket(o={}){const x=o.x??rnd(-30,30),y=o.y??rnd(34,56),z=o.z??rnd(-105,-72),tr=fwPoints(12),from=new THREE.Vector3(x*0.7+rnd(-3,3),2,SHORE-22);
  for(let i=0;i<12;i++){tr.pos[i*3]=from.x;tr.pos[i*3+1]=from.y;tr.pos[i*3+2]=from.z}
  fireworks.push({rocket:true,...tr,from,to:new THREE.Vector3(x,y,z),t:NOW,dur:rnd(1.0,1.4),type:o.type??pick(FW_TYPES),ci:o.ci??(Math.random()*FW_COL.length|0),scale:o.scale??1,quiet:!!o.quiet,acc:0,wob:rnd(0,9)});

function dropFw(f){scene.remove(f.m);f.geo.dispose();if(f.fl){scene.remove(f.fl);f.fl.material.dispose()}f.done=true}
function updFireworks(dt){flashAmt*=Math.exp(-dt*4);
  ambFw-=dt;if(ambFw<=0){ambFw=rnd(20,36);if(NOW>fwBusy)rocket({scale:0.75,whistle:false,quiet:true,z:rnd(-135,-112),y:rnd(40,54)})}   // พลุไกลๆ เป็นระยะ ให้ฟ้าไม่นิ่ง
  for(const f of fireworks){const t=NOW-f.t,P=f.pos,C=f.col;f.acc+=dt;const shift=f.acc>=0.028;if(shift)f.acc=0;
    if(f.rocket){const k=Math.min(1,t/f.dur),e=ease.out(k),hx=f.from.x+(f.to.x-f.from.x)*e+Math.sin(t*18+f.wob)*0.3*(1-k),hy=f.from.y+(f.to.y-f.from.y)*e,hz=f.from.z+(f.to.z-f.from.z)*e;
      if(shift)for(let j=11;j>0;j--){P[j*3]=P[j*3-3];P[j*3+1]=P[j*3-2];P[j*3+2]=P[j*3-1]}P[0]=hx;P[1]=hy;P[2]=hz;
      for(let j=0;j<12;j++){const a=Math.pow(1-j/12,1.5)*(1-k*0.6);C[j*3]=1.0*a;C[j*3+1]=0.8*a;C[j*3+2]=0.45*a}

      if(k>=1){dropFw(f);burst(f.to.x,f.to.y,f.to.z,f.type,f.ci,f.scale,f.quiet)}continue}
    const k=t/f.life;if(k>=1){dropFw(f);continue}
    const TR=f.TR,dr=Math.exp(-f.drag*dt),I0=(1-k*k)*(k<0.04?k/0.04:1),white=Math.max(0,1-k*3.2);
    if(f.crk&&k>0.45){f.crk=false;fwSound('fw_crackle',0.38)}
    for(let i=0;i<f.n;i++){const b=i*TR*3,v=f.v[i];
      if(shift)for(let j=TR-1;j>0;j--){const d=b+j*3;P[d]=P[d-3];P[d+1]=P[d-2];P[d+2]=P[d-1]}
      v[0]*=dr;v[1]=v[1]*dr-f.grav*dt;v[2]*=dr;P[b]+=v[0]*dt;P[b+1]+=v[1]*dt;P[b+2]+=v[2]*dt;
      const cc=v[3]?f.c3:f.c1;let I=I0;if(k>0.5&&Math.random()<f.tw)I*=Math.random()<0.5?1.9:0.12;   // ประกายระยิบช่วงท้าย
      const r=(cc.r+(f.c2.r-cc.r)*white)*I,g2=(cc.g+(f.c2.g-cc.g)*white)*I,bl=(cc.b+(f.c2.b-cc.b)*white)*I;
      for(let j=0;j<TR;j++){const d=b+j*3,tf=j?Math.pow(1-j/TR,1.6)*0.55:1;C[d]=r*tf;C[d+1]=g2*tf;C[d+2]=bl*tf}}

const realActive=()=>Object.values(P).some(p=>(p.wishes||p.hearts)&&NOW-p.last<30);
function npcRelease(){const c=walkers.filter(w=>!w.p&&!w.lead&&w.s>1.3&&w.g.position.x>-8&&w.g.position.x<23&&w.cheer<=0);if(!c.length)return;const w=pick(c);
  if(!w.npc)w.npc={name:NPC.names[NPC.i++%NPC.names.length],sample:true,npc:true,shirt:'#5a7090',hearts:0,wishes:0};
  makeLantern(w.npc,pick(SAMPLE),Math.random()<0.12?'flower':'sample',{from:w})}
function attract(dt){if(NPC.level>0){NPC.t-=dt;if(NPC.t<=0){const busy=realActive();NPC.t=NPC.level===2?(busy?rnd(8,12):rnd(3,5)):(busy?rnd(16,26):rnd(5,8));npcRelease()}}
  mcIdle(dt)}
// คนเพิ่งเข้าห้องแต่ยังไม่ทำอะไร: ได้ตัวเดินในงานพร้อมป้ายชื่อทันที โบกมือ และโฆษกเรียกชื่อ ถ้าไม่เล่นต่อ 35 วิ ตัวจะออกจากงานเอง (มีตัวรอแบบนี้ได้พร้อมกัน 12 ตัว)
function joined(name,pic){if(PRESIM||!name||!clean(name))return;if(!P[name]&&Object.values(P).filter(p=>p.walker&&!p.wishes&&!p.hearts).length<12){const p=player(name,pic),w=walkerOf(p);if(w){w.stop=2.4;w.cheer=1.6;w.face=0}}
  welcome(name)}
// คำสั่งจากหน้า /control และรายงานสถานะกลับทุกวินาที
function control(c){const a=c.arg;if(c.cmd==='npc')NPC.level=clamp(+a|0,0,2);else if(c.cmd==='fireworks')show(8,{heart:true});else if(c.cmd==='say'&&a&&clean(a))mcSay(String(a).slice(0,150),{pri:1,chime:1,ttl:60});else if(c.cmd==='reload')location.reload();else if(c.cmd==='musvol'){MUS.vol=clamp(+a||0,0,1);if(MUS.bus)MUS.bus.gain.value=MUS.vol}else if(c.cmd==='mc')CFG.mc=+a?1:0;else if(c.cmd==='welcome')CFG.welcome=+a?1:0;else if(c.cmd==='mcgap')CFG.gap=clamp(+a||15,6,120);else if(c.cmd==='goal')CFG.goal=clamp(+a||1,0.25,5);sendState()}
let wsRef=null;
function sendState(){if(!wsRef||wsRef.readyState!==1)return;wsRef.send(JSON.stringify({type:'state',game:'krathong',state:'play',players:Object.values(P).filter(p=>(p.wishes||p.hearts)&&NOW-p.last<60).length,watching:greeted.size,lanterns:lanterns.length,hearts:liveHearts,wishes:wishesTotal,npc:NPC.level,fps:Math.round(fpsNow),quality,live:live.state,audio:SND.ctx?SND.ctx.state:'none',mcSaid:MC.said||0,mcBusy:!!MC.busy,mcQ:MC.q.length}))}
setInterval(sendState,1000);

// ---------- คนดูจำลอง / โหมดทดสอบ ----------
const FAKE=['ploy_99','mek.k','nongbeam','jaa_jaa','tonkla','minnie.th','pond2002','fern.f'],FAKE2=['somchai','น้องมายด์','beer_bkk','kwankwan','aomsin','พี่ต้น','nutty','น้องฟ้า','benz','ป้าแดง'];let simT={c:1,l:0,g:9,j:3};
function sim(){const act=Object.values(P).filter(p=>!p.sample&&NOW-p.last<IDLE);
  if(NOW>simT.c){simT.c=NOW+rnd(2,5);comment(pick(FAKE),pick(SAMPLE))}
  if(NOW>simT.j){simT.j=NOW+rnd(6,11);joined(pick(FAKE2))}
  if(NOW>simT.l){simT.l=NOW+0.5;if(act.length&&Math.random()<0.7)like(pick(act).name,rnd(1,6)|0)}
  if(NOW>simT.g){simT.g=NOW+rnd(10,18);if(act.length)gift(pick(act).name,pick([1,1,5,30,30,100,299]))}}
let crowdOn=Q.has('demo');
if(Q.has('test')){const me='ผู้ทดสอบ',bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.92);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 15px Kanit,Tahoma;z-index:9';
  const btn=(l,fn,bg='#3a3f48')=>{const b=document.createElement('button');b.textContent=l;b.style.cssText=`background:${bg};color:#fff;border:0;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer`;b.onclick=e=>{e.stopPropagation();SND.ctx&&SND.ctx.resume();fn()};bar.appendChild(b);return b};
  const inp=document.createElement('input');inp.value='ขอให้สอบผ่าน';inp.maxLength=34;inp.style.cssText='font:inherit;padding:7px 9px;border-radius:8px;border:0;width:190px';inp.onpointerdown=e=>e.stopPropagation();inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')comment(me,inp.value)};bar.appendChild(inp);btn('ลอยกระทง',()=>comment(me,inp.value),'#4a7a3a');btn('♥ x5',()=>like(me,5),'#c0394b');btn('♥ x50',()=>like(me,50),'#c0394b');
  btn('กุหลาบ 1',()=>gift(me,1,'5655'),'#8a5a2a');btn('โดนัท 30',()=>gift(me,30,'5879'),'#8a5a2a');btn('มือหัวใจ 100',()=>gift(me,100,'5660'),'#8a5a2a');btn('คอร์กี้ 299',()=>gift(me,299,'6267'),'#8a5a2a');
  btn('กดติดตาม',()=>{followDone.delete(me);follow(me)},'#c0394b');btn('พลุ',()=>show(8,{heart:true}),'#5a3a7a');btn('คนเข้าห้อง (ยังไม่เล่น)',()=>{const n=FAKE2.find(x=>!greeted.has(x))||pick(FAKE2)+' '+(greeted.size+1);joined(n)},'#3a5a7a');const nb=btn('ชาวงานลอยกระทง: '+['ปิด','ปกติ','คึกคัก'][NPC.level],()=>{NPC.level=(NPC.level+1)%3;NPC.t=1;nb.textContent='ชาวงานลอยกระทง: '+['ปิด','ปกติ','คึกคัก'][NPC.level]},'#3a5a7a');const cb=btn('คนดูจำลอง: ปิด',()=>{crowdOn=!crowdOn;cb.textContent='คนดูจำลอง: '+(crowdOn?'เปิด':'ปิด')});document.body.appendChild(bar)}
Object.assign(window,{comment,like,gift,follow,show,rocket,burst,welcome,joined,P,_dev:{scene,renderer,composer,bloom,fwMat,THREE},dbg:()=>({greeted:greeted.size,npc:NPC.level,npcLanterns:lanterns.filter(L=>L.p&&L.p.npc).length,idleWalkers:Object.values(P).filter(p=>p.walker&&!p.wishes&&!p.hearts).length,mc:{said:MC.said||0,q:MC.q.length},honor:!!honor,top:RK.top.map(p=>p.name+' '+faith(p)).join(', '),music:MUS.next>0,audio:SND.ctx&&SND.ctx.state,lanterns:lanterns.length,walkers:walkers.length,fireworks:fireworks.length,quality,fps:Math.round(fpsNow),calls:renderer.info.render.calls,tris:renderer.info.render.triangles,sounds:Object.keys(SND.buf).sort().join(' ')})});

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=clean(name)?name:'ผู้ใช้',i=2;const base=n;while(used[n]&&used[n]!==id)n=`${base}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){if(ev.type==='status'){live={...live,...ev};return}if(ev.type==='control'){control(ev);return}const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);else if(ev.type==='like')like(name,ev.count||1,ev.pic);else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic,ev.gift,ev.count||1);else if(ev.type==='follow')follow(name,ev.pic,ev.repeat);else if(ev.type==='join')joined(name,ev.pic)}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);wsRef=ws;ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}

// ---------- loop ----------
let last=performance.now(),errN=0;
// ถ้าเครื่องวาดไม่ทัน (ต่ำกว่า 34 เฟรมต่อวินาที) ลดความละเอียดก่อน แล้วค่อยปิดแสงฟุ้ง
let fpsN=0,fpsT0=performance.now(),quality=0,fpsNow=0,lowN=0;
function fpsGuard(){fpsN++;const now=performance.now();if(now-fpsT0<2000)return;fpsNow=fpsN*1000/(now-fpsT0);fpsN=0;fpsT0=now;
  if(honor||NOW<10||document.visibilityState!=='visible'){lowN=0;return}lowN=fpsNow<34?lowN+1:0;
  if(lowN>=3&&quality<2){lowN=0;quality++;if(quality===1){renderer.setPixelRatio(0.75);composer.setPixelRatio(0.75)}else bloom.enabled=false;console.log('ลดคุณภาพภาพระดับ '+quality+' ('+fpsNow.toFixed(0)+' fps)')}}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(0.05,(t-last)/1000);last=t;NOW+=dt;
  try{if(MODEL){modelView.items.forEach(o=>{if(!Q.has('still'))o.g.rotation.y+=dt*0.4;const f=0.85+0.12*Math.sin(NOW*13);o.flames.forEach(fl=>fl.scale.set(0.2*(0.8+0.25*f),0.34*(0.7+0.4*f),1))});renderer.info.reset();renderer.render(modelView.ms,modelView.cam);g.clearRect(0,0,W,H);return}
    if(crowdOn)sim();attract(dt);updScene(dt);updLanterns(dt);updFireworks(dt);musicTick();fpsGuard();
    updCamera(dt);
    renderer.info.reset();composer.render();drawOverlay()}catch(e){if(errN++<5)console.error(e)}}
const KEEP=[];
function prewarm(){if(MODEL)return;const t0=performance.now();try{const tmp=[];
  Object.keys(KIND).forEach((k,i)=>{const o=buildLantern(k);o.g.position.set(-8+i*4,0.1,-30);scene.add(o.g);tmp.push(o.g);KEEP.push(o)});
  const pw=makePerson({viewer:true,item:'balloon'});pw.g.position.set(0,0,SHORE-3);scene.add(pw.g);tmp.push(pw.g);KEEP.push(pw);
  const was=PRESIM;PRESIM=true;FW_TYPES.concat('heart').forEach((t,i)=>burst(-12+i*4,30,-80,t,i));rocket({whistle:false});PRESIM=was;
  updFireworks(0.016);renderer.info.reset();composer.render();
  tmp.forEach(o=>scene.remove(o));fireworks.forEach(f=>{if(!f.done)dropFw(f)});fireworks=[];flashAmt=0;ambFw=rnd(9,16)}catch(e){console.error('prewarm',e)}
  console.log('อุ่นเครื่อง '+(performance.now()-t0).toFixed(0)+' ms')}
document.fonts.load('700 40px Kanit').finally(()=>{prewarm();last=performance.now();requestAnimationFrame(loop)});
</script></body></html>
