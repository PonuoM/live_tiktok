{const n=1400,p=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,e=0.12+Math.random()*0.85,r=520;p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r}

{const m=new THREE.Mesh(new THREE.SphereGeometry(9,24,16),new THREE.MeshBasicMaterial({color:0xfff1d0,fog:false}));m.position.set(-70,140,-320);scene.add(m);const gl=glowSprite(0xffe8c0,45,.3);gl.position.copy(m.position);gl.material.fog=false;scene.add(gl)}

ridge(-260,0x3a3470,70,1.3);ridge(-170,0x2c2858,46,4.1);ridge(-110,0x221f46,26,7.7);

{const land=new THREE.Mesh(new THREE.PlaneGeometry(1000,70),new THREE.MeshStandardMaterial({color:0x252036,roughness:1}));land.rotation.x=-Math.PI/2;land.position.set(0,0.06,SHORE-35);scene.add(land);

  for(let k=1;k<10;k++){const t=k/10,x=px+t*10,y=6-Math.sin(t*Math.PI)*1.4;bulb(x,y,SHORE-0.5,LCOL[(px/10+k+50)%LCOL.length|0],0.9)}}

{const rim=new THREE.Mesh(new THREE.TorusGeometry(9,0.18,6,40),new THREE.MeshStandardMaterial({color:0x8a8aa0,emissive:0xffb070,emissiveIntensity:0.5}));wheel.add(rim);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2,sp=new THREE.Mesh(new THREE.BoxGeometry(0.12,9,0.12),new THREE.MeshStandardMaterial({color:0x6a6a80}));sp.position.set(Math.cos(a)*4.5,Math.sin(a)*4.5,0);sp.rotation.z=a-Math.PI/2;wheel.add(sp);
    const cab=glowSprite(LCOL[i%LCOL.length],1.8,0.95);cab.position.set(Math.cos(a)*9,Math.sin(a)*9,0.3);wheel.add(cab)}
  for(const sx of [-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(0.3,13,0.3),wood);leg.position.set(21+sx*3.5,5.5,SHORE-14);leg.rotation.z=sx*0.26;scene.add(leg)}}
// ต้นไม้เงาหลังงาน
{const leaf=new THREE.MeshStandardMaterial({color:0x161a2c,roughness:1});for(let i=0;i<14;i++){const s=rnd(1.2,2.2),t=new THREE.Mesh(new THREE.ConeGeometry(2.2*s,7*s,7),leaf);t.position.set(-60+i*9+rnd(-3,3),3.5*s,SHORE-20-rnd(0,8));scene.add(t)}}
// คนเดินในงาน: ตัวทรงกระบอกหัวกลม เดินไปมาตามทางเดินริมน้ำ หยุดดูร้านบ้าง
const SKIN=[0xd9a982,0xc89870,0xe0b896,0xb88a62];
const walkers=[];
function makeWalker(col,p){const gr=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:col,roughness:.9});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.55,1.5,8),m);body.position.y=1.15;gr.add(body);
  const legs=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.4,0.8,8),new THREE.MeshStandardMaterial({color:0x2a2a38}));legs.position.y=0.4;gr.add(legs);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.38,10,8),new THREE.MeshStandardMaterial({color:pick(SKIN)}));head.position.y=2.25;gr.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.4,10,6,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x1a1416}));hair.position.y=2.3;gr.add(hair);
  gr.scale.setScalar(p?1.9:1.6);gr.position.set(p?rnd(-19,19):rnd(-45,45),0,SHORE-rnd(1.5,5));scene.add(gr);
  const w={g:gr,p,dir:pick([-1,1]),sp:rnd(1.2,2.4),stop:0,ph:rnd(0,9)};walkers.push(w);return w}
for(let i=0;i<26;i++)makeWalker(pick([0xa85a4a,0x4a6a8a,0x8a7a4a,0x6a4a7a,0x4a7a6a,0x9a6a3a,0xc0c0c8,0xd08aa0]));
function updWalkers(dt){for(let i=walkers.length-1;i>=0;i--){const w=walkers[i];if(w.p&&NOW-w.p.last>90){scene.remove(w.g);walkers.splice(i,1);w.p.walker=null}}
  for(const w of walkers){const g=w.g;if(w.p&&w.leave){g.position.y-=dt*0;}
  if(w.stop>0){w.stop-=dt;g.rotation.y=Math.PI*0.9}else{g.position.x+=w.dir*w.sp*dt;g.rotation.y=w.dir>0?Math.PI/2:-Math.PI/2;g.position.y=Math.abs(Math.sin(NOW*7+w.ph))*0.12;
    const lim=w.p?21:46;if(g.position.x>lim)w.dir=-1;if(g.position.x<-lim)w.dir=1;if(Math.random()<dt*0.05)w.stop=rnd(1.5,4)}}}
// คนดูที่เข้ามาได้ตัวเดินในงานของตัวเอง โคมของคนนั้นลอยขึ้นจากตรงที่เขายืน
function walkerOf(p){if(!p||p.sample)return null;if(!p.walker){p.walker=makeWalker(new THREE.Color().setHSL(Math.random(),0.55,0.55).getHex(),p);p.walker.sp=rnd(1.5,2.6)}return p.walker}
scene.add(new THREE.HemisphereLight(0x8a90d0,0x1a1830,1.1));
const warm=new THREE.PointLight(0xffa860,40,60,1.6);warm.position.set(5,5,7);scene.add(warm);
// หิ่งห้อยเหนือน้ำ
const flies=[];for(let i=0;i<26;i++){const s=glowSprite(0xffe08a,rnd(.5,.9),.8);s.position.set(rnd(-25,25),rnd(.6,4),rnd(-10,26));s.userData={p:rnd(0,9),b:s.position.clone()};scene.add(s);flies.push(s)}

const composer=new EffectComposer(renderer);composer.setSize(W,H);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),0.55,0.4,0.62);composer.addPass(bloom);composer.addPass(new OutputPass());

// สัดส่วนวัดจากภาพ: สูง 1.35 เท่าของส่วนกว้างสุด ปากล่างกว้าง 0.8 เท่า ส่วนกว้างสุดอยู่ราว 70% ของความสูง ยอดโค้งมนแล้วจีบเข้าหากัน
// ดูโมเดลใกล้ๆ ได้ที่ /play/lantern?model=1&kind=plain,flower,gold,giant
const PANELS=8,PROFILE=[[0.72,0],[0.735,0.25],[0.78,0.7],[0.84,1.15],[0.885,1.5],[0.9,1.75],[0.865,1.97],[0.77,2.14],[0.58,2.29],[0.35,2.39],[0.15,2.435],[0.03,2.45]];
function prng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ตัวโคม: หมุนเส้นโครงรอบแกน แล้วให้กระดาษแต่ละกลีบโป่งออกเล็กน้อยระหว่างตะเข็บ ผิวยับนิดๆ
const latheG=(()=>{const geo=new THREE.LatheGeometry(new THREE.SplineCurve(PROFILE.map(([x,y])=>new THREE.Vector2(x,y))).getSpacedPoints(24),40),p=geo.attributes.position,col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),t=Math.min(1,y/1.5),c=0.3+0.7*t*t*(3-2*t);col[i*3]=col[i*3+1]=col[i*3+2]=c;if(Math.hypot(x,z)<0.02)continue;const a=Math.atan2(x,z);
    const k=1+(0.022+0.03*Math.min(1,Math.max(0,(y-1.2)/1.0)))*(1-Math.abs(Math.cos(a*PANELS/2)))*Math.min(1,y/0.5)+0.006*Math.sin(a*19+y*13)+0.005*Math.sin(a*31-y*23);p.setX(i,x*k);p.setZ(i,z*k)}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();return geo})();
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;t.anisotropy=4;return t}
function crumple(x,w,h,R,n,al){x.filter='blur(1.4px)';for(let i=0;i<n;i++){const cx=R()*w,cy=R()*h,s=6+R()*22;x.fillStyle=R()<0.5?`rgba(255,255,255,${al*R()})`:`rgba(40,20,5,${al*R()})`;
  x.beginPath();x.moveTo(cx+(R()-.5)*s,cy+(R()-.5)*s);x.lineTo(cx+(R()-.5)*s,cy+(R()-.5)*s);x.lineTo(cx+(R()-.5)*s,cy+(R()-.5)*s);x.fill()}x.filter='none'}
function seams(x,w,h,style,half){x.fillStyle=style;for(let k=0;k<=PANELS;k++)x.fillRect(k*w/PANELS-half,0,half*2,h)}

const KIND={
 plain:{c:0xfff0d8,g:0xff8a30,ei:1.0,s:0.75,stops:['#ff9c34','#f5842e','#bf6a3c','#54402f']},
 flower:{c:0xffd8e4,g:0xff6a9a,ei:1.05,s:0.85,stops:['#ff8a8a','#ff6e8c','#d7507d','#6a3550'],deco:'flower'},

    crumple(x,w,h,R,1100,0.10);seams(x,w,h,'rgba(70,30,8,.09)',2.6);seams(x,w,h,'rgba(60,25,5,.15)',0.9);
    deco(x,w,h,K,true)})}

function deco(x,w,h,K,em){
  if(K.deco==='bands'){x.fillStyle=em?'rgba(215,40,35,.9)':'rgba(190,30,30,.92)';x.fillRect(0,h*0.35,w,h*0.028);x.fillStyle=em?'rgba(120,85,10,.78)':'rgba(205,165,50,.95)';x.fillRect(0,h*0.925,w,h*0.05);x.fillStyle=em?'rgba(255,225,120,.5)':'rgba(255,235,150,.9)';x.fillRect(0,h*0.925,w,h*0.008)}
  if(K.deco==='flower')for(let k=0;k<PANELS;k++){const cx=(k+0.5)*w/PANELS,cy=h*0.5;x.fillStyle=em?'rgba(255,245,250,.6)':'rgba(255,255,255,.92)';
    for(let j=0;j<5;j++){const a=j/5*6.283-1.57;x.beginPath();x.ellipse(cx+Math.cos(a)*7,cy+Math.sin(a)*13,5,9,0,0,7);x.fill()}x.fillStyle='rgba(255,210,90,.9)';x.beginPath();x.ellipse(cx,cy,3.2,5.5,0,0,7);x.fill()}}

const HARDWARE=(()=>{const parts=[],R0=PROFILE[0][0],add=(geo,hex)=>{const c=new THREE.Color(hex),n=geo.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b}geo.setAttribute('color',new THREE.BufferAttribute(a,3));parts.push(geo)};
  const ring=new THREE.TorusGeometry(R0,0.02,6,40);ring.rotateX(Math.PI/2);ring.translate(0,0.01,0);add(ring,0xd2ad72);
  for(let k=0;k<PANELS;k++){const a=k/PANELS*Math.PI*2,b=new THREE.CylinderGeometry(0.028,0.028,0.05,6);b.rotateZ(Math.PI/2);b.rotateY(-(a+Math.PI/2));b.translate(R0*Math.cos(a),0.01,R0*Math.sin(a));add(b,0x9c7a48)}
  for(const a of [Math.PI/4,-Math.PI/4]){const wire=new THREE.CylinderGeometry(0.008,0.008,R0*2,4);wire.rotateZ(Math.PI/2);wire.rotateY(a);wire.translate(0,0.035,0);add(wire,0x8f8f8c)}

function buildLantern(kind){const K=KIND[kind],g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:K.c,map:paperMap(kind),emissive:0xffffff,emissiveMap:glowMap(kind),emissiveIntensity:K.ei,side:THREE.DoubleSide,roughness:.9,transparent:true,opacity:.97,bumpMap:PAPER,bumpScale:1.2,vertexColors:true});

let lanterns=[];
function dropLantern(L){scene.remove(L.g);L.mat.dispose();L.gl.material.dispose();L.flame.material.dispose()}
function makeLantern(p,wish,kind='plain',opt={}){const K=KIND[kind],o=buildLantern(kind),g=o.g;
  const sc=2.3*K.s*(1+Math.min(0.5,(p&&p.hearts||0)/600));g.scale.setScalar(sc);
  const wk=walkerOf(p),src=wk?wk.g.position:(opt.x!=null?null:pick(walkers).g.position);if(wk){wk.stop=3}
  g.position.set(opt.x??clamp(src.x,-21,21),3.5,opt.z??src.z);g.rotation.y=rnd(0,6.28);scene.add(g);
  const L={...o,p,wish,kind,born:NOW,vy:rnd(2.0,2.8)*(kind==='giant'?0.8:1),vx:rnd(-0.55,0.45),ph:rnd(0,9),boost:0,boostT:-9,fade:1,ei:K.ei,sc};
  lanterns.push(L);if(lanterns.length>70)dropLantern(lanterns.shift());return L}
function updLanterns(dt){for(const L of lanterns){const t=NOW-L.born;L.boost=Math.max(0,L.boost-dt*0.5);
  const up=L.vy*(t<2?0.4+0.3*t:1)+L.boost*1.8;L.g.position.y+=up*dt;L.g.position.x+=(L.vx+Math.sin(NOW*0.4+L.ph)*0.35)*dt;L.g.position.z-=0.9*dt;
  L.g.rotation.y+=dt*0.3;L.g.rotation.z=Math.sin(NOW*1.3+L.ph)*0.06;
  const fl=0.85+0.12*Math.sin(NOW*13+L.ph)+0.06*Math.random();L.mat.emissiveIntensity=L.ei*fl*(1+L.boost*0.6);L.gl.material.opacity=0.45*L.fade*(1+L.boost*0.5);
  L.flame.scale.set(0.42*(0.8+0.25*fl),0.66*(0.7+0.4*fl),1);
  const top=120;if(L.g.position.y>top-15){L.fade=clamp((top-L.g.position.y)/15,0,1);L.mat.opacity=0.97*L.fade;L.flame.material.opacity=0.95*L.fade;L.hw.visible=L.fade>0.5}}
  lanterns=lanterns.filter(L=>{if(L.fade<=0.01){dropLantern(L);return false}return true})}

let fireworks=[];
function firework(x,y,z,color){const n=160,pos=new Float32Array(n*3),vel=[];for(let i=0;i<n;i++){pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;const a=Math.random()*Math.PI*2,b=Math.acos(rnd(-1,1)),s=rnd(9,15);vel.push(new THREE.Vector3(Math.sin(b)*Math.cos(a)*s,Math.cos(b)*s,Math.sin(b)*Math.sin(a)*s))}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.Points(geo,new THREE.PointsMaterial({color,size:1.3,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,map:glowTex}));scene.add(m);
  const fl=glowSprite(color,50,0.9);fl.position.set(x,y,z);scene.add(fl);fireworks.push({m,geo,vel,t:NOW,fl});sfx('gift1',0.5)}
function rocket(color){const x=rnd(-35,35),y=rnd(38,62),z=rnd(-90,-60);const r=glowSprite(0xffe0a0,2.6,1);r.position.set(x*0.6,1,SHORE-6);scene.add(r);fireworks.push({rocket:r,from:r.position.clone(),to:new THREE.Vector3(x,y,z),t:NOW,color})}
function updFireworks(dt){for(const f of fireworks){const t=NOW-f.t;
  if(f.rocket){const k=Math.min(1,t/1.1);f.rocket.position.lerpVectors(f.from,f.to,ease.out(k));if(k>=1){scene.remove(f.rocket);f.done=true;firework(f.to.x,f.to.y,f.to.z,f.color)}continue}
  const a=f.geo.attributes.position;for(let i=0;i<f.vel.length;i++){const v=f.vel[i];v.y-=3*dt;v.multiplyScalar(0.985);a.array[i*3]+=v.x*dt;a.array[i*3+1]+=v.y*dt;a.array[i*3+2]+=v.z*dt}a.needsUpdate=true;
  f.m.material.opacity=clamp(1.6-t*0.7,0,1);f.fl.material.opacity=Math.max(0,0.9-t*3);if(t>2.4){scene.remove(f.m);scene.remove(f.fl);f.geo.dispose();f.done=true}}
  fireworks=fireworks.filter(f=>!f.done)}

const SND={ctx:null,buf:{},last:{}};let voices=0,PRESIM=false;
function sndInit(){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}const c=SND.ctx;SND.master=c.createGain();SND.master.gain.value=0.9;SND.master.connect(c.destination);
  SND.bus=c.createGain();const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;SND.bus.connect(comp).connect(SND.master);
  fetch('/sounds').then(r=>r.json()).then(d=>{Object.keys(d.list||{}).forEach(k=>{if(!/^(gift\d?|levelup|honor|win)$/.test(k))return;const v=(d.choice||{})[k]||'a';
    fetch(`/sfx/${k}_${v}.mp3`).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>c.decodeAudioData(b)).then(a=>{SND.buf[k]=a}).catch(()=>{})})}).catch(()=>{});
  const resume=()=>{if(SND.ctx.state!=='running')SND.ctx.resume()};addEventListener('pointerdown',resume);addEventListener('keydown',resume)}
function sfx(k,vol=1){const c=SND.ctx,b=SND.buf[k];if(!c||!b||c.state!=='running'||PRESIM)return;const now=performance.now()/1000;if(SND.last[k]&&now-SND.last[k]<0.12)return;if(voices>10)return;SND.last[k]=now;
  const s=c.createBufferSource();s.buffer=b;s.playbackRate.value=rnd(0.95,1.08);const g=c.createGain();g.gain.value=vol;s.connect(g).connect(SND.bus);voices++;s.onended=()=>voices--;s.start()}
const ANN=[];let annBusy=false;
function announce(name){if(PRESIM||!clean(name))return;if(ANN.length>=40)ANN.shift();ANN.push({t:name,at:performance.now()/1000});if(!annBusy)annNext()}
function say(text){if(ANN.length<40)ANN.push({t:text,at:performance.now()/1000,line:true});if(!annBusy)annNext()}
async function annNext(){while(ANN.length&&performance.now()/1000-ANN[0].at>120)ANN.shift();const a=ANN.shift();if(!a){annBusy=false;return}annBusy=true;const c=SND.ctx;
  if(!c||c.state!=='running'){annBusy=false;ANN.length=0;return}
  const buf=await Promise.race([fetch('/say?v=niwat&t='+encodeURIComponent(a.t),{cache:'no-cache'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>b?c.decodeAudioData(b):null).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),6000))]);
  if(buf)await new Promise(res=>{const s=c.createBufferSource();s.buffer=buf;if(ANN.length>=3)s.playbackRate.value=1.12;const g=c.createGain();g.gain.value=a.line?0.75:0.6;s.connect(g).connect(SND.master);s.onended=res;s.start()});
  setTimeout(annNext,ANN.length>=3?150:500)}

const SAMPLE_P={name:'ตัวอย่าง',sample:true,shirt:'#6a5a8a',hearts:0};let sampleT=2,ctaT=40;
function attract(dt){const busy=Object.values(P).some(p=>NOW-p.last<30);
  sampleT-=dt;if(sampleT<=0){sampleT=busy?rnd(12,20):rnd(4,7);makeLantern(busy?null:SAMPLE_P,busy?null:pick(SAMPLE),'sample')}

const FAKE=['ploy_99','mek.k','nongbeam','jaa_jaa','tonkla','minnie.th','pond2002','fern.f'];let simT={c:1,l:0,g:9};

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=clean(name)?name:'ผู้ใช้',i=2;const base=n;while(used[n]&&used[n]!==id)n=`${base}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){if(ev.type==='status'){live={...live,...ev};return}if(ev.type==='control')return;const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);else if(ev.type==='like')like(name,ev.count||1,ev.pic);else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic);else if(ev.type==='follow')follow(name,ev.pic,ev.repeat)}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}
