  if(NOW>simT.l){simT.l=NOW+0.5;if(act.length&&Math.random()<0.7)like(pick(act).name,rnd(1,6)|0)}
  if(NOW>simT.g){simT.g=NOW+rnd(10,18);if(act.length)gift(pick(act).name,pick([1,1,5,30,30,100,299]))}}
let crowdOn=Q.has('demo');
if(Q.has('test')){const me='ผู้ทดสอบ',bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.92);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 15px Kanit,Tahoma;z-index:9';
  const btn=(l,fn,bg='#3a3f48')=>{const b=document.createElement('button');b.textContent=l;b.style.cssText=`background:${bg};color:#fff;border:0;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer`;b.onclick=e=>{e.stopPropagation();SND.ctx&&SND.ctx.resume();fn()};bar.appendChild(b);return b};
  btn('พิมพ์คำอธิษฐาน',()=>{const t=prompt('คำอธิษฐาน','ขอให้สอบผ่าน');if(t)comment(me,t)},'#4a7a3a');btn('♥ x5',()=>like(me,5),'#c0394b');btn('♥ x50',()=>like(me,50),'#c0394b');
  btn('กุหลาบ 1',()=>gift(me,1,'5655'),'#8a5a2a');btn('โดนัท 30',()=>gift(me,30,'5879'),'#8a5a2a');btn('มือหัวใจ 100',()=>gift(me,100,'5660'),'#8a5a2a');btn('คอร์กี้ 299',()=>gift(me,299,'6267'),'#8a5a2a');
  btn('กดติดตาม',()=>{followDone.delete(me);follow(me)},'#c0394b');btn('พลุ',()=>show(8,{heart:true}),'#5a3a7a');const cb=btn('คนดูจำลอง: ปิด',()=>{crowdOn=!crowdOn;cb.textContent='คนดูจำลอง: '+(crowdOn?'เปิด':'ปิด')});document.body.appendChild(bar)}
Object.assign(window,{comment,like,gift,follow,show,rocket,burst,P,dbg:()=>({music:MUS.next>0,audio:SND.ctx&&SND.ctx.state,lanterns:lanterns.length,walkers:walkers.length,fireworks:fireworks.length,quality,fps:Math.round(fpsNow),calls:renderer.info.render.calls,tris:renderer.info.render.triangles,sounds:Object.keys(SND.buf).sort().join(' ')})});

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=clean(name)?name:'ผู้ใช้',i=2;const base=n;while(used[n]&&used[n]!==id)n=`${base}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){if(ev.type==='status'){live={...live,...ev};return}if(ev.type==='control')return;const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);else if(ev.type==='like')like(name,ev.count||1,ev.pic);else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic);else if(ev.type==='follow')follow(name,ev.pic,ev.repeat)}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}

// ---------- loop ----------
let last=performance.now(),errN=0;
// ถ้าเครื่องวาดไม่ทัน (ต่ำกว่า 34 เฟรมต่อวินาที) ลดความละเอียดก่อน แล้วค่อยปิดแสงฟุ้ง
let fpsN=0,fpsT0=performance.now(),quality=0,fpsNow=0;
function fpsGuard(){fpsN++;const now=performance.now();if(now-fpsT0<4000)return;fpsNow=fpsN*1000/(now-fpsT0);fpsN=0;fpsT0=now;
  if(NOW>10&&fpsNow<34&&quality<2&&document.visibilityState==='visible'){quality++;if(quality===1){renderer.setPixelRatio(0.75);composer.setPixelRatio(0.75)}else bloom.enabled=false;console.log('ลดคุณภาพภาพระดับ '+quality+' ('+fpsNow.toFixed(0)+' fps)')}}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(0.05,(t-last)/1000);last=t;NOW+=dt;
  try{if(MODEL){modelView.items.forEach(o=>{if(!Q.has('still'))o.g.rotation.y+=dt*0.4;const f=0.85+0.12*Math.sin(NOW*13);o.flame.scale.set(0.42*(0.8+0.25*f),0.66*(0.7+0.4*f),1)});renderer.info.reset();renderer.render(modelView.ms,modelView.cam);g.clearRect(0,0,W,H);return}
    if(crowdOn)sim();attract(dt);updScene(dt);updLanterns(dt);updFireworks(dt);musicTick();fpsGuard();
    camera.position.x=Math.sin(NOW*0.07)*1.2;camera.position.y=4.5+Math.sin(NOW*0.11)*0.3;camera.lookAt(LOOK);
    renderer.info.reset();composer.render();drawOverlay()}catch(e){if(errN++<5)console.error(e)}}
document.fonts.load('700 40px Kanit').finally(()=>requestAnimationFrame(loop));
</script></body></html>
