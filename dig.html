<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<title>ขุดสมบัติ LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{height:100vh;aspect-ratio:9/16}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ===== ขุดสมบัติ: คนดูช่วยกันขุดลงใต้ดิน ไม่มีแพ้ เป้าคือลึกกว่าสถิติเดิม =====
// กดหัวใจ = ขุด  พิมพ์ 1-9 = เลือกช่อง  บล็อกที่ใครขุดแตก สมบัติในนั้นเป็นของคนนั้น  ของขวัญ = ระเบิดหลายชั้น
// ?demo=1 คนดูจำลอง  ?speed=3 เร่งเวลา  ?safe=1 ระบายส่วนที่ UI ของ TikTok บัง  ?depth=60 เริ่มที่ความลึกนั้น (ไว้ตรวจฉาก)
const Q=new URLSearchParams(location.search),DEMO=Q.has('demo')||Q.has('test'),SPEED=+Q.get('speed')||1,SHOWSAFE=Q.has('safe');
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=1080,H=1920,FONT='Kanit, Tahoma, sans-serif';
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const short=(s,n=8)=>s.length>n?s.slice(0,n)+'…':s;
const ease={out:k=>1-(1-k)*(1-k),back:k=>{const c=1.7;k-=1;return 1+k*k*((c+1)*k+c)},in:k=>k*k*k};
let NOW=0,live={state:DEMO?'demo':'connecting'};
// วัดจากจอมือถือจริง: แถบบนของ TikTok กิน 0-65 คอมเมนต์ล่างซ้ายกิน 1400 ลงไป
const SAFE_T=72,SAFE_B=1390;
const COLS=9,BS=120,FRONT_Y=1000,ZLEN=20,IDLE=25;

// ---------- ชั้นดิน: ทุก 20 เมตรเปลี่ยนฉาก ----------
const ZONES=[
 {n:'ดินร่วน',a:'#8a6440',b:'#6e4e32',c:'#a07a52',bg:'#3c2a1c',deco:'pebble'},
 {n:'รากไม้โบราณ',a:'#6f4f35',b:'#563c28',c:'#87634a',bg:'#30221a',deco:'root'},
 {n:'หินแกรนิต',a:'#77777d',b:'#5c5c63',c:'#93939a',bg:'#2c2c33',deco:'speck'},
 {n:'ถ้ำคริสตัล',a:'#4f4a78',b:'#3c375e',c:'#6a64a0',bg:'#1e1b33',deco:'crystal'},
 {n:'สุสานไดโนเสาร์',a:'#a8956c',b:'#8a7854',c:'#c2af86',bg:'#3b3222',deco:'bone'},
 {n:'แม่น้ำลาวา',a:'#4c2a24',b:'#3a1e1a',c:'#64382e',bg:'#1e0e0b',deco:'lava'},
 {n:'เมืองใต้ดินที่หายไป',a:'#7a6c52',b:'#5f533e',c:'#958566',bg:'#2a241a',deco:'brick'},
 {n:'ธารน้ำแข็งลึก',a:'#7aa0b8',b:'#5d8299',c:'#a6c8dc',bg:'#1c2a35',deco:'ice'},
 {n:'แกนโลก',a:'#5a2418',b:'#43180f',c:'#7a3420',bg:'#1a0806',deco:'core'}];
function zoneOf(r){return Math.max(0,Math.floor(r/ZLEN))}
function zoneInfo(z){const b=ZONES[z%ZONES.length],lap=Math.floor(z/ZONES.length);return {...b,n:lap?`${b.n} ชั้น ${lap+1}`:b.n,lap}}

// ลายบล็อกพิกเซล 30x30 ขยาย 4 เท่า สุ่มไว้ 4 แบบต่อชั้น
const TEX={};
function mkTex(z,hard){const k=`${z%ZONES.length}${hard?'h':''}`;if(TEX[k])return TEX[k];const Z=ZONES[z%ZONES.length];TEX[k]=[];
  for(let v=0;v<4;v++){const c=document.createElement('canvas');c.width=c.height=30;const x=c.getContext('2d');
    x.fillStyle=hard?shade(Z.a,0.72):Z.a;x.fillRect(0,0,30,30);
    for(let i=0;i<120;i++){x.fillStyle=Math.random()<0.5?(hard?shade(Z.b,0.7):Z.b):(hard?shade(Z.c,0.8):Z.c);x.fillRect(Math.random()*30|0,Math.random()*30|0,1+(Math.random()<0.3),1)}
    const d=Z.deco;x.globalAlpha=1;
    if(d==='pebble')for(let i=0;i<3;i++){const px=rnd(3,25)|0,py=rnd(3,25)|0;x.fillStyle='#b8a48a';x.fillRect(px,py,3,2);x.fillStyle='#6a5a48';x.fillRect(px,py+2,3,1)}
    if(d==='root'){x.fillStyle='#3b2a1e';let px=rnd(0,30)|0;for(let y=0;y<30;y++){px+=Math.random()<0.3?(Math.random()<0.5?-1:1):0;x.fillRect(px,y,2,1)}}
    if(d==='speck')for(let i=0;i<6;i++){x.fillStyle=pick(['#c8c8cf','#3a3a40','#a89a90']);x.fillRect(rnd(1,28)|0,rnd(1,28)|0,1,1)}
    if(d==='crystal')for(let i=0;i<2;i++){const px=rnd(4,24)|0,py=rnd(8,24)|0,col=pick(['#9fe4ff','#d79cff','#8affc8']);x.fillStyle=col;x.fillRect(px,py-5,2,6);x.fillRect(px+2,py-3,2,4);x.fillStyle='#fff';x.fillRect(px,py-5,1,2)}
    if(d==='bone'&&Math.random()<0.6){const px=rnd(4,20)|0,py=rnd(6,22)|0;x.fillStyle='#efe6cf';x.fillRect(px,py,8,2);x.fillRect(px-1,py-1,2,4);x.fillRect(px+7,py-1,2,4)}
    if(d==='lava'){x.fillStyle='#e8602c';let py=rnd(5,25)|0;for(let px=0;px<30;px++){py+=Math.random()<0.25?(Math.random()<0.5?-1:1):0;x.fillRect(px,py,1,2)}x.fillStyle='#ffb04a';x.fillRect(rnd(3,26)|0,rnd(3,26)|0,2,1)}
    if(d==='brick'){x.fillStyle=shade(Z.b,0.8);for(let y=0;y<30;y+=7){x.fillRect(0,y,30,1);for(let px=(y/7%2)*7;px<30;px+=14)x.fillRect(px,y,1,7)}}
    if(d==='ice'){x.fillStyle='rgba(255,255,255,.55)';x.fillRect(rnd(3,20)|0,rnd(3,20)|0,6,1);x.fillRect(rnd(3,20)|0,rnd(3,20)|0,1,5)}
    if(d==='core')for(let i=0;i<4;i++){x.fillStyle=pick(['#ff7a2c','#ffd04a','#e8402c']);x.fillRect(rnd(1,28)|0,rnd(1,28)|0,2,2)}
    if(hard){x.fillStyle='rgba(220,230,240,.5)';for(let i=0;i<5;i++)x.fillRect(rnd(2,27)|0,rnd(2,27)|0,2,1)}
    // ขอบบนสว่าง ขอบล่างมืด ให้ดูเป็นก้อน
    x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,0,30,1);x.fillRect(0,0,1,30);x.fillStyle='rgba(0,0,0,.28)';x.fillRect(0,29,30,1);x.fillRect(29,0,1,30);
    TEX[k].push(c)}return TEX[k]}
// รอยร้าว 3 ระดับ
const CRACK=[1,2,3].map(n=>{const c=document.createElement('canvas');c.width=c.height=30;const x=c.getContext('2d');x.fillStyle='rgba(15,10,8,.85)';
  for(let k=0;k<n*2;k++){let px=15+rnd(-4,4),py=15+rnd(-4,4);const a=rnd(0,6.28);for(let s=0;s<6+n*2;s++){px+=Math.cos(a+rnd(-0.7,0.7))*1.4;py+=Math.sin(a+rnd(-0.7,0.7))*1.4;x.fillRect(px|0,py|0,1,1)}}return c});
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=n>>16,g2=n>>8&255,b2=n&255;
  const k=v=>Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));return '#'+[k(r),k(g2),k(b2)].map(v=>v.toString(16).padStart(2,'0')).join('')}

// ---------- สมบัติ ----------
const LOOT={coin:{n:'เหรียญทอง',pts:10,col:'#f0c86a'},gem:{n:'อัญมณี',pts:30,col:'#7fd8ff'},fossil:{n:'ฟอสซิล',pts:60,col:'#efe6cf'},relic:{n:'ของโบราณ',pts:100,col:'#e89a5a'},chest:{n:'หีบสมบัติ',pts:300,col:'#ffd04a'}};
function mkIcon(rows,pal){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}));return c}
const ICON={
 coin:mkIcon(['..oooo..','.oyyyyo.','oyYyyyyo','oyYyyyyo','oyYyyyyo','oyyyyyBo','.oyyyBo.','..oooo..'],{o:'#5a3a08',y:'#f0c86a',Y:'#fff3b0',B:'#b8862a'}),
 gem:mkIcon(['..oooo..','.obWbbo.','obWbbbbo','oBbbbbBo','.oBbbBo.','..oBBo..','...oo...'],{o:'#103850',b:'#5ac8ff',W:'#e8faff',B:'#2a8ac0'}),
 fossil:mkIcon(['oo....oo','owo..owo','.owwwwo.','..owwo..','.owwwwo.','owo..owo','oo....oo'],{o:'#5a4a30',w:'#efe6cf'}),
 relic:mkIcon(['...oo...','..oyyo..','.oyRRyo.','.oyRRyo.','oyyyyyyo','oYyyyyBo','.oooooo.'],{o:'#4a2a10',y:'#e8a050',Y:'#ffd28a',B:'#a85a20',R:'#c0392b'}),
 chest:mkIcon(['.oooooooo.','obbbbbbbbo','oBBByyBBBo','oooyYYyooo','obbbyybbbo','obbbbbbbbo','oBBBBBBBBo','.oooooooo.'],{o:'#2a1808',b:'#9a5a2a',B:'#6a3a18',y:'#f0c86a',Y:'#fff3b0'})};
function rollLoot(r,boost){const z=zoneOf(r),ch=(0.13+Math.min(0.12,z*0.015))*(boost?3:1);if(Math.random()>ch)return null;
  const w=[['coin',60-z*4],['gem',22+z*2],['fossil',z>=1?12+z:4],['relic',z>=2?6+z*1.5:1],['chest',2+z*0.6]];
  let s=w.reduce((a,b)=>a+Math.max(1,b[1]),0)*Math.random();for(const [k,v] of w){s-=Math.max(1,v);if(s<=0)return k}return 'coin'}

// ---------- แผนที่ใต้ดิน ----------
const rows={};let front=+Q.get('depth')||0,camY=front*BS,goldRows=0,maxDepth=0;
function blockHp(r){return 3+zoneOf(r)*1.6+r*0.03}
function row(r){if(rows[r])return rows[r];const z=zoneOf(r),hardCol=Math.random()<0.18?rnd(0,COLS)|0:-1;
  rows[r]=[...Array(COLS)].map((_,c)=>{const hard=c===hardCol,max=blockHp(r)*(hard?2.5:1);return {hp:max,max,hard,loot:rollLoot(r,r<goldRows),tex:Math.random()*4|0,hitT:-9,by:null}});return rows[r]}
for(let r=0;r<front;r++)row(r).forEach(b=>b.hp=0);
function rowDone(r){return row(r).every(b=>b.hp<=0)}
function rowTop(r){return FRONT_Y+(r*BS-camY)}
// ช่องที่ขุดต่อในคอลัมน์: บล็อกแรกที่ยังไม่แตกตั้งแต่ชั้นหน้าลงไป
function digRow(c){let r=front;while(row(r)[c].hp<=0)r++;return r}

// ---------- คนดู ----------
let P={},fx=[],pops=[],banners=[],flyers=[],pending=[],shake=0;
const SHIRTS=['#a85a4a','#4a6a8a','#8a7a4a','#6a4a7a','#4a7a6a','#9a6a3a','#5a5f8f','#8f4f5f'];
const PICK=[{n:'พลั่วไม้',c:'#a07850',m:1},{n:'จอบหิน',c:'#9a9aa0',m:1.5},{n:'จอบเหล็ก',c:'#d0d4da',m:2},{n:'จอบทอง',c:'#f0c86a',m:3},{n:'จอบเพชร',c:'#7fe8f8',m:4}];
const LV=[0,30,100,250,500];
function lvOf(h){let l=1;LV.forEach((v,i)=>{if(h>=v)l=i+1});return l}
function active(){return Object.values(P).filter(p=>NOW-p.last<IDLE&&!p.bot)}
function colCount(c){return Object.values(P).filter(p=>(p.bot||NOW-p.last<IDLE)&&p.col===c).length}
function setPic(p,url){if(!url||p.picUrl===url)return;p.picUrl=url;const im=new Image();im.referrerPolicy='no-referrer';im.src=url;p.pic=im}
function player(name,pic){let p=P[name];
  if(!p){let best=[...Array(COLS).keys()].sort((a,b)=>colCount(a)-colCount(b)||Math.abs(a-4)-Math.abs(b-4))[0];
    p=P[name]={name,col:best,wc:best,x:best*BS+BS/2,last:NOW,hearts:0,lv:1,pts:0,q:0,cd:0,swing:-9,shirt:pick(SHIRTS),slot:Math.random()};
    if(!PRESIM){announce(name);popup(`${short(name,10)} มาช่วยขุด!`,p.x,FRONT_Y-170,'#f0c86a',30)}}
  else if(NOW-p.last>=IDLE&&!PRESIM)announce(name);
  setPic(p,pic);p.last=NOW;return p}
const BOT={name:'คนงานบอท',bot:true,col:4,wc:4,x:4*BS+BS/2,last:0,hearts:0,lv:1,pts:0,q:0,cd:0,swing:-9,shirt:'#6a6a5a',slot:0.5};

function popup(s,x,y,col='#fff',size=34,img=null){pops.push({s,x,y,col,size,img,t:NOW})}
function banner(s,col='#fff',sub=''){banners.push({s,col,sub,t:Math.max(NOW,...banners.map(b=>b.t+2.4))})}

// ---------- ขุด ----------
function hit(p,dmg){
  // ช่องตัวเองขุดลึกนำหน้าไปแล้ว เดินไปช่วยช่องที่ชั้นหน้ายังไม่แตกที่ใกล้ที่สุด
  let c=p.col;if(digRow(c)>front+1){const open=[...Array(COLS).keys()].filter(i=>row(front)[i].hp>0).sort((a,b)=>Math.abs(a-p.col)-Math.abs(b-p.col));if(open.length)c=open[0]}
  p.wc=c;const r=digRow(c),b=row(r)[c];p.swing=NOW;
  if(b.chestPart&&bigChest){hitChest(p,dmg);return}
  b.hp-=dmg;b.hitT=NOW;const x=c*BS+BS/2,y=rowTop(r)+8;
  for(let i=0;i<3;i++)fx.push({type:'chip',x:x+rnd(-30,30),y,vx:rnd(-160,160),vy:rnd(-260,-80),c:pick([ZONES[zoneOf(r)%ZONES.length].a,ZONES[zoneOf(r)%ZONES.length].c]),t:NOW,life:0.5});
  if(Math.random()<0.4)fx.push({type:'spark',x,y,vx:rnd(-200,200),vy:rnd(-260,-60),c:'#ffe9a0',t:NOW,life:0.25});
  sfx('wallhit',0.45);
  if(b.hp<=0)breakBlock(r,c,p)}
function breakBlock(r,c,p,quiet){const b=row(r)[c];if(b.broke)return;b.broke=true;b.hp=0;b.by=p?p.name:null;
  const x=c*BS+BS/2,y=rowTop(r)+BS/2,Z=ZONES[zoneOf(r)%ZONES.length];
  for(let i=0;i<(quiet?5:10);i++)fx.push({type:'chunk',x:x+rnd(-40,40),y:y+rnd(-40,40),vx:rnd(-260,260),vy:rnd(-420,-120),c:pick([Z.a,Z.b,Z.c]),s:rnd(8,16),t:NOW,life:0.8});
  fx.push({type:'dust',x,y,t:NOW,life:0.5});
  if(!quiet)sfx('reload',0.7);
  if(b.loot)collect(b.loot,x,y,p)}
function collect(k,x,y,p){const L=LOOT[k],mul=goldRush>NOW?2:1,pts=L.pts*mul;
  if(p&&!p.bot){p.pts+=pts;liveTotal+=pts}
  flyers.push({k,x,y,t:NOW,name:p&&!p.bot?p.name:null});
  popup(`${L.n} +${pts}`,x,y-50,L.col,k==='chest'?40:30);
  sfx(k==='chest'?'gift3':k==='relic'||k==='fossil'?'gift2':'gift1',k==='coin'?0.5:0.8);
  if(k==='chest'){shake=Math.max(shake,14);for(let i=0;i<24;i++)fx.push({type:'spark',x,y,vx:rnd(-380,380),vy:rnd(-520,-100),c:pick(['#ffd04a','#fff3b0','#f0a040']),t:NOW,life:0.9})}}
// ระเบิด: แตกบล็อกตามพื้นที่ สมบัติเป็นของคนส่ง
function blast(rs,cs,p){let n=0;rs.forEach(r=>cs.forEach(c=>{const b=row(r)[c];if(b.chestPart){if(bigChest&&!p.bot&&!b.bl){b.bl=1;setTimeout(()=>b.bl=0,50);hitChest(p,blockHp(r)*3)}}else if(b.hp>0){breakBlock(r,c,p,n++>4);}}));
  const xs=cs.map(c=>c*BS+BS/2),ys=rs.map(r=>rowTop(r)+BS/2),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  fx.push({type:'boom',x:cx,y:cy,r:Math.max(140,(Math.max(...xs)-Math.min(...xs))*0.6),t:NOW,life:0.5});shake=Math.max(shake,18+rs.length*3);sfx('grenade')}

// ---------- ความลึก สถิติ ฉากใหม่ ----------
let record=0,recordBroken=false,liveTotal=0;
fetch('/dig-record').then(r=>r.json()).then(d=>{record=d.best||0}).catch(()=>{});
function saveRecord(){if(DEMO||live.state!=='live')return;fetch('/dig-record',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({best:Math.max(record,front)})}).catch(()=>{})}
function advance(){let moved=false;while(rowDone(front)){front++;moved=true;
    if(front%ZLEN===0){const z=zoneInfo(zoneOf(front));banner(`ถึงชั้น ${z.n}!`,'#f0c86a',`ความลึก ${front} เมตร`);sfx('levelup');zoneFlash=NOW;
      for(let i=0;i<60;i++)fx.push({type:'conf',x:rnd(0,W),y:rnd(380,700),vx:rnd(-80,80),vy:rnd(120,300),rot:rnd(0,6),vr:rnd(-8,8),c:pick(['#f0c86a','#e5566b','#7fd8ff','#9fe08a']),w:rnd(10,16),t:NOW,life:3})}
    if(record>0&&!recordBroken&&front>record){recordBroken=true;banner('ทำลายสถิติแล้ว!','#ffd04a',`ลึกกว่าไลฟ์ที่แล้ว (${record} เมตร)`);sfx('win');
      for(let i=0;i<120;i++)fx.push({type:'conf',x:rnd(0,W),y:rnd(300,600),vx:rnd(-80,80),vy:rnd(120,320),rot:rnd(0,6),vr:rnd(-8,8),c:pick(['#ffd04a','#fff','#e5566b','#7fd8ff']),w:rnd(10,18),t:NOW,life:4})}}
  if(moved&&front>maxDepth){maxDepth=front;if(front%5===0)saveRecord()}}
let zoneFlash=-9;

// ---------- เหตุการณ์สุ่ม ทุก 50-80 วิ ----------
let evT=40,goldRush=-9,bigChest=null;
function event(force){const k=force||pick(['chest','gold','quake','rush']);
  if(k==='chest'&&!bigChest){const r=front+2;row(r);const hp=blockHp(r)*14;bigChest={r,c0:3,hp,max:hp,hits:{}};[3,4,5].forEach(c=>{const b=row(r)[c];b.hp=Math.max(b.hp,0.001);b.chestPart=true});
    banner('หีบยักษ์โผล่!','#ffd04a','ช่วยกันขุด แบ่งสมบัติตามแรงที่ช่วย');sfx('honor')}
  else if(k==='gold'){goldRows=front+4;for(let r=front;r<front+4;r++)row(r).forEach(b=>{if(b.hp>0&&!b.loot&&Math.random()<0.45)b.loot=pick(['coin','coin','gem','relic'])});banner('เจอสายแร่ทอง!','#f0c86a','4 ชั้นข้างหน้าเต็มไปด้วยสมบัติ');sfx('gift2')}
  else if(k==='quake'){for(let r=front;r<front+3;r++)row(r).forEach(b=>{if(b.hp>0&&!b.chestPart)b.hp*=0.4});shake=40;banner('แผ่นดินไหว!','#e09a4a','หินร้าวไปครึ่งหนึ่ง ขุดง่ายขึ้น');sfx('tank',0.8);
    for(let i=0;i<30;i++)fx.push({type:'chunk',x:rnd(0,W),y:rnd(400,700),vx:rnd(-60,60),vy:rnd(0,200),c:'#6a5a48',s:rnd(6,14),t:NOW,life:1.2})}
  else{goldRush=NOW+20;banner('สมบัติ x2 !','#9fe08a','20 วินาที ทุกชิ้นได้แต้มสองเท่า');sfx('gift2')}}

// ---------- เสียง (ใช้ชุดเดียวกับป้อมสุดท้าย) ----------
const SND={ctx:null,buf:{},last:{},choice:{}};let voices=0,PRESIM=false;
const SGAP={wallhit:0.09,reload:0.08,gift1:0.12,gift2:0.2,gift3:0.3,grenade:0.15,levelup:0.4};
function sndInit(){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const c=SND.ctx;SND.master=c.createGain();SND.master.gain.value=0.9;SND.master.connect(c.destination);
  SND.comp=c.createDynamicsCompressor();SND.comp.threshold.value=-18;SND.comp.knee.value=12;SND.comp.ratio.value=6;SND.comp.connect(SND.master);
  SND.bus=c.createGain();SND.bus.connect(SND.comp);
  fetch('/sounds').then(r=>r.json()).then(d=>{SND.choice=d.choice||{};Object.keys(d.list||{}).forEach(k=>{const v=SND.choice[k]||'a';
    fetch(`/sfx/${k}_${v}.mp3`).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>SND.ctx.decodeAudioData(b)).then(a=>{SND.buf[k]=a}).catch(()=>{})})}).catch(()=>{});
  const resume=()=>{if(SND.ctx&&SND.ctx.state!=='running')SND.ctx.resume()};addEventListener('pointerdown',resume);addEventListener('keydown',resume)}
function sfx(k,vol=1){const c=SND.ctx,b=SND.buf[k];if(!c||!b||c.state!=='running'||PRESIM)return;const now=performance.now()/1000;
  if(SND.last[k]&&now-SND.last[k]<(SGAP[k]||0))return;if(voices>14)return;SND.last[k]=now;
  const src=c.createBufferSource();src.buffer=b;if(k==='wallhit'||k==='reload')src.playbackRate.value=rnd(0.85,1.15);
  const gn=c.createGain();gn.gain.value=vol;src.connect(gn).connect(SND.bus);voices++;src.onended=()=>voices--;src.start()}
// เรียกชื่อทุกคนที่เข้ามาช่วยขุด เบาๆ ต่อด้วยเสียงกริ๊ง คิวยาวอ่านเร็วขึ้น ชื่อที่รอเกิน 2 นาทีข้าม
const ANN=[];let annBusy=false;
function announce(name){if(PRESIM)return;if(ANN.length>=40)ANN.shift();ANN.push({name,t:performance.now()/1000});if(!annBusy)annNext()}
async function annNext(){while(ANN.length&&performance.now()/1000-ANN[0].t>120)ANN.shift();const a=ANN.shift();if(!a){annBusy=false;return}annBusy=true;const c=SND.ctx,rush=ANN.length>=3;
  if(!c||c.state!=='running'){annBusy=false;ANN.length=0;return}
  const nameP=fetch('/say?v=niwat&t='+encodeURIComponent(a.name),{cache:'no-cache'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>b?c.decodeAudioData(b):null).catch(()=>null);
  const play=(b,vol)=>new Promise(res=>{if(!b)return res();const s=c.createBufferSource();s.buffer=b;if(rush)s.playbackRate.value=1.12;const gn=c.createGain();gn.gain.value=vol;s.connect(gn).connect(SND.master);s.onended=res;s.start()});
  if(MUS.bus)MUS.bus.gain.setTargetAtTime(0.85,c.currentTime,0.1);
  if(!rush)await play(SND.buf.gift1,0.3);
  const nb=await Promise.race([nameP,new Promise(r=>setTimeout(()=>r(null),6000))]);await play(nb,0.7);
  if(!ANN.length&&MUS.bus)MUS.bus.gain.setTargetAtTime(1,c.currentTime,0.4);setTimeout(annNext,rush?150:450)}
const MUS={src:null};
function musicTick(){const c=SND.ctx,b=SND.buf.bgm_battle;if(!c||c.state!=='running'||PRESIM||!b)return;
  if(!MUS.bus){MUS.bus=c.createGain();MUS.bus.gain.value=1;MUS.bus.connect(SND.master)}
  if(!MUS.src){const s=c.createBufferSource();s.buffer=b;s.loop=true;const gn=c.createGain();gn.gain.value=0.8;s.connect(gn).connect(MUS.bus);s.start();MUS.src=s}}
sndInit();

// ---------- update ----------
function update(dt){
  musicTick();updCine();
  pending=pending.filter(e=>{if(NOW>=e.t){e.fn();return false}return true});
  const act=active(),workers=act.length?act:[];
  // บอทขุดช้าๆ ให้จอขยับตลอด คนน้อยบอทช่วยมากหน่อย
  if(DEMO||live.state==='live')BOT.q+=dt*(act.length?0.6:1.6);BOT.last=NOW;
  [...workers,BOT].forEach(p=>{
    p.cd-=dt;const rate=p.q>20?16:p.q>6?10:6;
    if(p.q>=1&&p.cd<=0){p.q-=1;p.cd=1/rate;const dmg=PICK[p.lv-1].m*teamMul;
      hit(p,dmg);advance()}
    p.q=Math.min(p.q,80);
    const tx=p.wc*BS+BS/2+(p.slot-0.5)*56;p.x+=(tx-p.x)*Math.min(1,dt*6)});
  camY+=(front*BS-camY)*Math.min(1,dt*4);
  evT-=dt;if(evT<=0){evT=rnd(50,80);event()}
  if(Q.has('demo')||(window.__crowd&&__crowd()))sim();
  flyers=flyers.filter(f=>NOW-f.t<1.4);fx=fx.filter(f=>NOW-f.t<f.life);pops=pops.filter(p=>NOW-p.t<1.4);
}

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=name,i=2;while(used[n]&&used[n]!==id)n=`${name}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){if(ev.type==='status'){live={...live,...ev};return}
  const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);else if(ev.type==='like')like(name,ev.count||1,ev.pic);
  else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic);else if(ev.type==='follow')follow(name,ev.pic,ev.repeat)}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};
  ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}

// ---------- loop (error ส่วนไหนก็ตาม เฟรมถัดไปยังเดินต่อ) ----------
let last=performance.now(),errShown=0;
const START=+Q.get('t')||0;PRESIM=true;for(let t=0;t<START;t+=1/30){NOW+=1/30;update(1/30)}PRESIM=false;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(0.05,(t-last)/1000)*SPEED;last=t;NOW+=dt;
  try{update(dt)}catch(e){if(errShown++<5)console.error('update',e)}shake*=0.86;
  try{g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';render()}catch(e){if(errShown++<5)console.error('render',e)}}
document.fonts.load('700 40px Kanit').finally(()=>requestAnimationFrame(loop));
</script></body></html>
