<script>
// ===== ป้อมสุดท้าย: ทาวเวอร์ดีเฟนซ์ ฝั่งคน vs ฝั่งซอมบี้ สำหรับ TikTok LIVE =====
// ?demo=1 ใช้คนดูจำลอง  ?speed=2 เร่งเวลา  ?safe=1 แสดงขอบที่ TikTok ทับ

const short=(s,n=8)=>s.length>n?s.slice(0,n)+'…':s;
let NOW=0;
// แถบบนของ TikTok กินราว 0-200 แถบล่างราว 1620-1920 ข้อมูลสำคัญอยู่ระหว่างนี้เท่านั้น
const SAFE_T=200,SAFE_B=1620;
const SPAWN_Y=480,WALL_TOP=1135,WALL_BOT=1225,STAND_Y=1158,HIT_Y=1118;
const ROUND=90,IDLE=20,MAXWALL=1500,INTER=8,RANGE_H=700,RANGE_T=800;

// ---------- sprites (พิกเซลละเอียด มีเงา) ----------
const SW=16;
function mk(rows,pal){const c=document.createElement('canvas');c.width=SW;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,y)=>[...r.padEnd(SW,'.').slice(0,SW)].forEach((ch,i)=>{if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}));return c}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=n>>16,g2=n>>8&255,b2=n&255;
  const k=v=>Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));return '#'+[k(r),k(g2),k(b2)].map(v=>v.toString(16).padStart(2,'0')).join('')}
// ทหารบนกำแพง เห็นจากด้านหลัง หมวกเหล็ก เป้สนาม

".....oooooo.....",
"....oHHhhhhko...",

"...ohhhhhhhhko..",
"...okkkkkkkkko..",
"....onsssssno...",
"..ootttttttttoo.",

".ottdDDDDDDDtTo.",

"..oTTTTTTTTTTo..",

"..opppPoopppPo.."];

const ZOMB=[
".....oooooo.....",
"....ohhhhhhho...",
"...ohhgggghhho..",

const ZLB=["...oppo...oPpo..","...oppo..oPpo...","...oggo..oggo...","...oooo..oooo..."];
const SHIRTS=['#a85a4a','#4a6a8a','#8a7a4a','#6a4a7a','#4a7a6a','#9a6a3a','#5a5f8f','#8f4f5f'];
const ZSHIRT=['#7a6a58','#5d6b7d','#7d5a5a','#6a6f55','#6b5d73'];
function humanSet(shirt,helm){const pal={o:'#17191d',h:helm,H:shade(helm,1.35),k:shade(helm,0.65),s:'#d9a982',n:'#a87c5c',
  t:shirt,T:shade(shirt,0.7),d:'#6b5a40',D:'#4d4030',p:'#4a4f3a',P:'#363a2b',b:'#2b2620'};
  return [mk(HUMAN.concat(HLA),pal),mk(HUMAN.concat(HLB),pal)]}
function zombSet(shirt,skin='#8fa88a'){const pal={o:'#17191d',h:'#3b3027',g:skin,G:shade(skin,0.75),W:'#e8e0b0',E:'#c0392b',m:'#5a2a2a',M:'#1e1212',
  c:shirt,C:shade(shirt,0.65),p:'#4a4e5a',P:'#363944'};
  return [mk(ZOMB.concat(ZLA),pal),mk(ZOMB.concat(ZLB),pal)]}
const ZS={bot:ZSHIRT.map(c=>zombSet(c,pick(['#8fa88a','#9aa98c','#86a08a']))),boss:zombSet('#3a2f45','#8a7fa0'),big:zombSet('#5a3a3a','#7d9a73')};
function drawSpr(set,x,y,s,frame,alpha=1){const c=set[frame%2],w=c.width*PX*s,h=c.height*PX*s;
  g.globalAlpha=alpha*0.35;g.fillStyle='#000';g.beginPath();g.ellipse(x,y-2,w*0.38,PX*s*2.2,0,0,7);g.fill();
  g.globalAlpha=alpha;g.imageSmoothingEnabled=false;g.drawImage(c,Math.round(x-w/2),Math.round(y-h),Math.round(w),Math.round(h));g.globalAlpha=1}

// ---------- background (วาดครั้งเดียว โทนสนามรบตอนเย็น) ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');
function R(x,y,w,h,c){b.fillStyle=c;b.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function blob(x,y,rx,ry,c,a=1){b.globalAlpha=a;b.fillStyle=c;b.beginPath();b.ellipse(x,y,rx,ry,0,0,7);b.fill();b.globalAlpha=1}
(function drawBg(){
  // ท้องฟ้าเย็น (ส่วนใหญ่โดนแถบ TikTok บัง)
  const sky=b.createLinearGradient(0,0,0,330);sky.addColorStop(0,'#5d6b80');sky.addColorStop(1,'#c9a383');b.fillStyle=sky;b.fillRect(0,0,W,330);
  // พื้นหญ้าหม่น มีลายเป็นหย่อม
  R(0,300,W,WALL_TOP-300,'#55693f');
  for(let i=0;i<260;i++)blob(rnd(0,W),rnd(300,WALL_TOP),rnd(30,110),rnd(14,45),pick(['#5d7245','#4d6139','#61774a','#586b3e','#6a7a4a']),0.55);
  // ทางดิน
  for(let y=330;y<WALL_TOP;y+=6){const cx=540+Math.sin(y/140)*40;blob(cx,y,rnd(95,115),10,pick(['#7d6a4f','#76644a','#82705a']),0.9)}
  for(let y=340;y<WALL_TOP;y+=14){const cx=540+Math.sin(y/140)*40;R(cx-52,y,10,8,'#5f503b');R(cx+42,y,10,8,'#5f503b')}
  // หลุมระเบิด
  [[230,620,70],[860,880,60],[300,960,48],[780,520,52],[150,820,40]].forEach(([x,y,r])=>{blob(x,y,r,r*0.45,'#3f3426');blob(x,y-4,r*0.78,r*0.32,'#2c251c');blob(x-r*0.2,y-r*0.3,r*0.5,r*0.12,'#6b5a42',0.7)});
  // ยอดหญ้า ก้อนหิน
  for(let i=0;i<2600;i++){const x=rnd(0,W),y=rnd(320,WALL_TOP-10);const cx=540+Math.sin(y/140)*40;if(Math.abs(x-cx)<110&&Math.random()<0.85)continue;
    R(x,y,3,rnd(5,10),pick(['#3e5030','#6f8550','#4a5e36','#7a8d58']))}
  for(let i=0;i<120;i++){const x=rnd(0,W),y=rnd(360,WALL_TOP-20),s=rnd(5,14);blob(x+2,y+3,s,s*0.55,'#000',0.25);blob(x,y,s,s*0.6,'#8a877f');blob(x-s*0.3,y-s*0.25,s*0.45,s*0.25,'#b3afa5')}
  // แนวป่าและหมอกด้านไกล
  for(let x=-30;x<W+30;x+=46){const h=rnd(70,130);blob(x,330-h*0.3,rnd(40,60),h*0.5,pick(['#2f3a2c','#35402f','#2a3428']))}
  const fog=b.createLinearGradient(0,280,0,520);fog.addColorStop(0,'rgba(190,175,160,.65)');fog.addColorStop(1,'rgba(190,175,160,0)');b.fillStyle=fog;b.fillRect(0,280,W,240);
  // ป้ายหลุมศพ (ที่ซอมบี้โผล่)
  [[120,452],[262,462],[410,446],[680,458],[830,448],[968,464]].forEach(([x,y])=>{blob(x+18,y+46,30,8,'#000',0.3);R(x,y,36,46,'#7d7f80');R(x+4,y-8,28,10,'#7d7f80');R(x+30,y,6,46,'#5e6061');
    R(x+15,y+8,6,22,'#4d4f50');R(x+8,y+14,20,6,'#4d4f50');R(x-6,y+44,48,8,'#3f3426');R(x+2,y+2,6,10,'#4f6b3f')});
  // ต้นไม้ตาย
  [[70,560],[1000,700],[930,450]].forEach(([x,y])=>{blob(x,y+6,30,8,'#000',0.3);b.strokeStyle='#2e2620';b.lineCap='round';
    [[0,0,0,-120,10],[0,-70,-40,-110,6],[0,-90,34,-130,6],[-20,-95,-34,-122,4]].forEach(([a1,b1,a2,b2,w])=>{b.lineWidth=w;b.beginPath();b.moveTo(x+a1,y+b1);b.lineTo(x+a2,y+b2);b.stroke()})});
  // รถทหารพัง
  blob(790,700,110,22,'#000',0.3);R(700,630,180,70,'#4d553f');R(716,600,100,40,'#59624a');R(726,606,36,24,'#2f3a40');R(772,606,36,24,'#2f3a40');R(700,630,180,6,'#6a7458');
  R(712,690,40,28,'#1c1c1c');R(828,690,40,28,'#1c1c1c');R(722,700,20,8,'#444');R(838,700,20,8,'#444');blob(860,640,26,14,'#3a3a3a',0.6);
  // เครื่องกีดขวางเหล็กกับลวดหนามหน้ากำแพง
  for(let x=60;x<W;x+=150){const y=1060+(x%300?14:0);b.strokeStyle='#2b2b2b';b.lineWidth=7;b.beginPath();b.moveTo(x-22,y+18);b.lineTo(x+22,y-18);b.moveTo(x+22,y+18);b.lineTo(x-22,y-18);b.moveTo(x,y-24);b.lineTo(x,y+22);b.stroke();blob(x,y+24,26,6,'#000',0.3)}
  b.strokeStyle='#5a5a5a';b.lineWidth=2;for(let k=0;k<2;k++){b.beginPath();for(let x=0;x<=W;x+=8)b.lineTo(x,1100+k*12+Math.sin(x/9+k)*5);b.stroke()}
  // กำแพงหิน สีแต่ละก้อนไม่เท่ากัน มีตะไคร่
  R(0,WALL_TOP-6,W,WALL_BOT-WALL_TOP+6,'#4a4844');
  for(let y=WALL_TOP;y<WALL_BOT;y+=22)for(let x=((y-WALL_TOP)/22)%2?-30:0;x<W;x+=60){const c=pick(['#8d8a83','#97938b','#827f78','#8a867c']);
    R(x+2,y+2,56,18,c);R(x+2,y+2,56,3,shade(c,1.15));R(x+2,y+17,56,3,shade(c,0.8));if(Math.random()<0.18)R(x+rnd(4,40),y+2,rnd(10,22),6,'#5f7044')}
  R(0,WALL_BOT-8,W,8,'#3a3834');
  for(let x=0;x<W;x+=72){R(x,WALL_TOP-28,46,30,'#8f8b83');R(x,WALL_TOP-28,46,4,'#aaa59b');R(x+40,WALL_TOP-28,6,30,'#6b6760');blob(x+23,WALL_TOP+2,26,5,'#000',0.25)}
  // ลานในป้อม ดินอัดแน่น
  R(0,WALL_BOT,W,H-WALL_BOT,'#6f6450');
  for(let i=0;i<220;i++)blob(rnd(0,W),rnd(WALL_BOT,H),rnd(20,70),rnd(8,24),pick(['#776b55','#695e4b','#7d7059']),0.6);
  // เต็นท์ กระสอบทราย ลังไม้ ธง
  blob(165,1385,110,16,'#000',0.3);b.fillStyle='#6d6a4f';b.beginPath();b.moveTo(60,1380);b.lineTo(165,1270);b.lineTo(270,1380);b.fill();b.fillStyle='#5a5741';b.beginPath();b.moveTo(165,1270);b.lineTo(270,1380);b.lineTo(200,1380);b.fill();R(150,1330,32,50,'#2b2a1f');
  for(let r=0;r<2;r++)for(let i=0;i<7-r;i++){const x=320+i*56+r*28,y=1300-r*26;R(x,y,52,26,'#a8956e');R(x,y,52,5,'#bfad85');R(x,y+20,52,6,'#857452')}
  [[700,1320],[752,1320],[726,1286]].forEach(([x,y])=>{R(x,y,48,40,'#7a5a36');R(x,y,48,5,'#94704a');R(x+4,y+18,40,4,'#5a4226')});
  R(900,1230,8,160,'#4a3f30');R(908,1236,92,54,'#3f5f86');R(908,1236,92,8,'#5276a3');R(940,1250,26,26,'#d9d2c0');
})();

// ---------- เสียง: เสียงประกอบจาก /sfx (เลือกแบบในหน้า /sound-pick) + ประกาศชื่อคนเข้าใหม่ ----------
const SND={ctx:null,buf:{},last:{},choice:{}};let voices=0;
// ไฟล์ใน sfx/live ปรับความดังมาแล้ว (ประกาศ -16 ของขวัญ -20 ระเบิด -22 ปืน -26 LUFS) ตรงนี้ปรับละเอียดอีกนิด
const SVOL={gun:0.8,mg:0.8,reload:0.8,grenade:0.9,tank:1,plane:1,zgroan:0.9,spit:0.9,wallhit:0.9,fog:1,frenzy:1,boss:1,gift:1,gift1:1,gift2:1,gift3:1,gift4:1,levelup:1,honor:1,win:1,lose:1,vo_soldier:1,vo_zombie:1};
const SGAP={gift1:0.25,gift2:0.3,gun:0.125,mg:0.28,reload:0.25,grenade:0.2,zgroan:1.2,spit:0.25,wallhit:0.45,levelup:0.4,gift:0.3};
function sndInit(){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const c=SND.ctx;SND.master=c.createGain();SND.master.gain.value=0.9;SND.master.connect(c.destination);
  SND.comp=c.createDynamicsCompressor();SND.comp.threshold.value=-18;SND.comp.knee.value=12;SND.comp.ratio.value=6;SND.comp.attack.value=0.003;SND.comp.release.value=0.25;SND.comp.connect(SND.master);
  SND.bus=c.createGain();SND.bus.connect(SND.comp);
  fetch('/sounds').then(r=>r.json()).then(d=>{SND.choice=d.choice||{};Object.keys(d.list||{}).forEach(k=>{const v=SND.choice[k]||'a';
    fetch(`/sfx/${k}_${v}.mp3`).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>SND.ctx.decodeAudioData(b)).then(a=>{SND.buf[k]=a}).catch(()=>{})})}).catch(()=>{});
  const resume=()=>{if(SND.ctx&&SND.ctx.state!=='running')SND.ctx.resume()};addEventListener('pointerdown',resume);addEventListener('keydown',resume)}
function sfx(k,vol=1){const c=SND.ctx,b=SND.buf[k];if(!c||!b||c.state!=='running'||PRESIM||k.startsWith('bgm'))return;const now=performance.now()/1000;
  if(SND.last[k]&&now-SND.last[k]<(SGAP[k]||0))return;if(voices>14)return;SND.last[k]=now;
  const src=c.createBufferSource();src.buffer=b;if(k==='gun'||k==='grenade'||k==='zgroan')src.playbackRate.value=rnd(0.9,1.1);
  const gn=c.createGain();gn.gain.value=(SVOL[k]||0.8)*vol;src.connect(gn).connect(SND.bus);voices++;src.onended=()=>voices--;src.start()}
// ประกาศ "ยินดีต้อนรับพลทหารใหม่" / "ซอมบี้ตัวใหม่" แล้วตามด้วยชื่อ (ชื่ออ่านด้วยเสียงฟรีของ Edge ผ่าน /say)
const ANN=[];let annBusy=false,PRESIM=false;
// คนเข้าถี่: ประโยคเต็มไม่เกินทุก 40 วิต่อฝั่ง นอกนั้นเล่นเสียงสั้นแล้วตามด้วยชื่อ และคิวเก็บไว้แค่ 2 ชื่อ
const PHRASE_GAP=40,annLast={h:-1e9,z:-1e9};
// อ่านชื่อทุกคน (ผู้ใช้อยากให้ทุกคนรู้สึกได้รับความสำคัญ) คิวยาวจะอ่านเร็วขึ้น ชื่อที่รอเกิน 2 นาทีข้ามไป
function announce(team,name){if(PRESIM)return;if(ANN.length>=40)ANN.shift();ANN.push({team,name,t:performance.now()/1000});if(!annBusy)annNext()}
async function annNext(){while(ANN.length&&performance.now()/1000-ANN[0].t>120)ANN.shift();const a=ANN.shift();if(!a){annBusy=false;return}annBusy=true;const c=SND.ctx;const rush=ANN.length>=3;
  if(!c||c.state!=='running'){annBusy=false;ANN.length=0;return}
  const nameP=fetch('/say?v=niwat&t='+encodeURIComponent(a.name),{cache:'no-cache'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>b?c.decodeAudioData(b):null).catch(()=>null);
  const playBuf=(b,vol)=>new Promise(res=>{if(!b)return res();const src=c.createBufferSource();src.buffer=b;if(rush)src.playbackRate.value=1.12;const gn=c.createGain();gn.gain.value=vol;src.connect(gn).connect(SND.master);src.onended=res;src.start()});
  SND.bus.gain.setTargetAtTime(0.6,c.currentTime,0.08);if(MUS.bus)MUS.bus.gain.setTargetAtTime(0.85,c.currentTime,0.1);
  const t=performance.now()/1000;
  if(t-annLast[a.team]>=PHRASE_GAP){annLast[a.team]=t;await playBuf(SND.buf[a.team==='h'?'vo_soldier':'vo_zombie'],0.6)}
  else if(!rush)await playBuf(SND.buf[a.team==='h'?'gift1':'zgroan'],0.3);
  const nb=await Promise.race([nameP,new Promise(r=>setTimeout(()=>r(null),6000))]);await playBuf(nb,0.7);if(!ANN.length){SND.bus.gain.setTargetAtTime(1,c.currentTime,0.25);if(MUS.bus)MUS.bus.gain.setTargetAtTime(1,c.currentTime,0.4)}setTimeout(annNext,rush?150:450)}
// เพลงพื้นหลัง: เพลงรบวนตลอด เปลี่ยนเป็นเพลงบอสตอนมีบอสหรือฝูงคลั่ง (ค่อยๆ ข้ามเพลง) และเบาลงตอนประกาศชื่อหรือจบรอบ
const MUS={cur:null,src:{},gain:{},want:'bgm_battle',vol:1};
function musicTick(){const c=SND.ctx;if(!c||c.state!=='running'||PRESIM)return;
  if(!MUS.bus){MUS.bus=c.createGain();MUS.bus.gain.value=1;MUS.bus.connect(SND.master)}
  const boss=zs.some(z=>z.kind==='boss'&&z.hp>0)||frenzy>NOW;MUS.want=boss?'bgm_boss':'bgm_battle';
  ['bgm_battle','bgm_boss'].forEach(k=>{const b=SND.buf[k];if(!b)return;
    if(!MUS.src[k]){const src=c.createBufferSource();src.buffer=b;src.loop=true;const gn=c.createGain();gn.gain.value=0;src.connect(gn).connect(MUS.bus);src.start();MUS.src[k]=src;MUS.gain[k]=gn}
    const target=(k===MUS.want?MUS.vol:0)*(round.state==='end'?0.4:1);MUS.gain[k].gain.setTargetAtTime(target,c.currentTime,k===MUS.want?0.6:0.9)})}
sndInit();

// ---------- state ----------
let P={},defs=[],zs=[],fx=[],pops=[],tracers=[],banners=[],pending=[];
let round={n:1,t0:0,wall:MAXWALL,state:'play',endT:0,win:null},score={h:0,z:0},likesTotal=0,spawnAcc=0,shake=0;

// ---------- combat ----------
function frontZ(){let best=null;for(const z of zs)if(z.hp>0&&(!best||z.y>best.y))best=z;return best}
function hurt(z,dmg,p){if(z.hp<=0)return;if(frenzy>NOW&&dmg<500)dmg*=0.5;z.hp-=dmg;z.hit=NOW;
  if(z.hp<=0){z.dead=NOW;const owner=p&&(p.name||p);if(owner&&P[owner]){P[owner].kills++;P[owner].totK=(P[owner].totK||0)+1}

function magSize(d){return d.mg>NOW?40:12+2*((d.p?d.p.lv:1)-1)}

  const ty=t.y-40*t.s;d.bx=t.x;d.by=ty;if(!mg)tracers.push({x1:sx+Math.cos(d.aim)*52,y1:sy+Math.sin(d.aim)*52,x2:t.x+rnd(-8,8),y2:ty,t:NOW,c:mg?'#ffb05a':'#ffe9a0',w:mg||lv>=3?5:3});

  if(mg)shake=Math.max(shake,2);

function newRound(){round={n:round.n+1,t0:NOW,wall:MAXWALL,state:'play',endT:0,win:null};zs=[];pending=[];proj=[];fog=0;frenzy=0;defs.forEach(d=>{d.downUntil=0;d.hp=d.max});D.clearRect(0,0,W,H);

// ---------- update ----------
function update(dt){
  if(DEMO)sim();
  updCine();updCam(dt);musicTick();
  for(let i=pending.length-1;i>=0;i--)if(NOW>=pending[i].t){const f=pending[i].fn;pending.splice(i,1);if(round.state==='play')f()}
  // คนที่ไม่ขยับเกิน 20 วิ ออกจากจอเอง
  for(const d of defs)if(!d.leave&&(!P[d.name]||NOW-P[d.name].last>IDLE||P[d.name].team!=='h'))d.leave=NOW;
  defs=defs.filter(d=>!d.leave||NOW-d.leave<0.8);
  zs.forEach(z=>{if(z.owner&&(!P[z.owner]||NOW-P[z.owner].last>IDLE))z.owner=null});
  activeOf('h').filter(p=>!defOf(p.name)).sort((a,b)=>b.last-a.last).forEach(seat);
  // ซอมบี้ของคนดูที่ยังเล่นอยู่ เกิดใหม่เองหลังตาย 1.5 วิ
  if(round.state==='play')activeOf('z').forEach(p=>{if(!myZombie(p.name)&&NOW>=(p.respawnAt||0)){p.respawnAt=NOW+1.5;spawnZ('player',p)}});
  if(round.state==='end'){if(NOW-round.endT>INTER)newRound();zs.forEach(z=>z.hp>0&&round.win==='h'&&hurt(z,999));}
  else{
    const el=NOW-round.t0;
    spawnAcc+=dt*(0.45+el*0.008+0.08*activeOf('h').length)*BAL.spawn;
    while(spawnAcc>=1){spawnAcc--;spawnZ('bot',null)}
    for(const d of defs){if(d.downUntil&&NOW>=d.downUntil){d.downUntil=0;d.hp=d.max;popup('กลับมาแล้ว!',d.x,STAND_Y-120,COL.h,30)}if(!d.leave)shoot(d,dt)}
    updProj();
    for(const t of turrets)shoot(t,dt);
    for(const z of zs){if(z.hp<=0)continue;
      if(z.by&&P[z.by]&&z.y>RANGE_H){const v=dt*(z.kind==='mini'?0.5:2);P[z.by].totD=(P[z.by].totD||0)+v;P[z.by].rz=(P[z.by].rz||0)+v}
      const spd=z.sp*(frenzy>NOW?1.6:1);
      if(z.kind==='spitter'||z.kind==='boss'){const stop=z.kind==='boss'?700:780;

        else{z.cd=(z.cd??0.4)-dt;if(z.cd<=0){z.cd=z.kind==='boss'?1.6:2.4;spit(z)}
          if(z.kind==='boss'){z.sp2=(z.sp2??1.5)-dt;if(z.sp2<=0){z.sp2=2.5;for(let i=0;i<2;i++)spawnZ('mini',P[z.by]||null,z.x+rnd(-70,70),z.y+10)}}}
        continue}

      else{z.atk=true;const d=z.dps*dt;round.wall-=d;if(z.by&&P[z.by]){P[z.by].dmg+=d;P[z.by].totD=(P[z.by].totD||0)+d;P[z.by].rz=(P[z.by].rz||0)+d}

        if(Math.random()<dt*3)fx.push({type:'dust',x:z.x+rnd(-20,20),y:WALL_TOP+10,vx:rnd(-60,60),vy:rnd(-120,-30),c:'#8d8a83',t:NOW,life:0.5})}}
    if(round.wall<=0){round.wall=0;endRound('z')}

  }

  if(Math.random()<dt*6)fx.push({type:'ember',x:rnd(0,W),y:rnd(900,1140),vx:rnd(-10,10),vy:rnd(-40,-20),t:NOW,life:rnd(2,4)});
  decFade+=dt;if(decFade>1.5){decFade=0;D.globalCompositeOperation='destination-out';D.fillStyle='rgba(0,0,0,.06)';D.fillRect(0,0,W,H);D.globalCompositeOperation='source-over'}
  fx=fx.filter(f=>NOW-f.t<f.life);pops=pops.filter(p=>NOW-p.t<1.4);tracers=tracers.filter(t=>NOW-t.t<0.07);
}

// ---------- render ----------
function txt(s,x,y,size,col='#fff',align='left',w=700,stroke='#000'){g.font=`${w} ${size}px ${FONT}`;g.textAlign=align;g.lineJoin='round';
  g.lineWidth=Math.max(5,size/4.5);g.strokeStyle=stroke;g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}
function panel(x,y,w,h,bc='#fff',a=0.8){g.beginPath();g.roundRect(x,y,w,h,18);g.fillStyle=`rgba(14,16,20,${a})`;g.fill();g.globalAlpha=0.85;g.strokeStyle=bc;g.lineWidth=3;g.beginPath();g.roundRect(x+2,y+2,w-4,h-4,16);g.stroke();g.globalAlpha=1}

// หมวกของซอมบี้คนดูตามเลเวล: 2 กรวยจราจร 3 ถัง 4 หมวกเหล็ก 5 มงกุฎ
function zHat(z){if(z.kind!=='player'||z.lv<2)return;const s=z.s*PX,hx=z.x,hy=z.y-18*s+2*s;
  if(z.lv===2){g.fillStyle='#e07a2c';g.beginPath();g.moveTo(hx-4*s,hy);g.lineTo(hx,hy-7*s);g.lineTo(hx+4*s,hy);g.fill();g.fillStyle='#f3e2c0';g.fillRect(hx-2.6*s,hy-3.5*s,5.2*s,1.2*s)}
  else if(z.lv===3){g.fillStyle='#8d949b';g.fillRect(hx-4.5*s,hy-5*s,9*s,5*s);g.fillStyle='#b3bac0';g.fillRect(hx-4.5*s,hy-5*s,9*s,1.2*s)}
  else if(z.lv===4){g.fillStyle='#4a5a3a';g.beginPath();g.ellipse(hx,hy-1*s,5.5*s,3.5*s,0,Math.PI,0);g.fill();g.fillRect(hx-6*s,hy-1*s,12*s,1.2*s)}
  else{g.fillStyle='#d4a72c';g.beginPath();g.moveTo(hx-5*s,hy);g.lineTo(hx-5*s,hy-5*s);g.lineTo(hx-2.5*s,hy-2.5*s);g.lineTo(hx,hy-6*s);g.lineTo(hx+2.5*s,hy-2.5*s);g.lineTo(hx+5*s,hy-5*s);g.lineTo(hx+5*s,hy);g.fill();
    g.fillStyle='#c0392b';g.fillRect(hx-1*s,hy-2.5*s,2*s,2*s);glow(hx,hy-3*s,10*s,'rgba(255,210,90,.6)',0.5)}}
function render(){
  try{
  g.save();if(shake>0.5)g.translate(rnd(-shake,shake),rnd(-shake,shake));applyCam();

  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.beginPath();g.roundRect(x,y,w,h,14);g.fill();
  g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x+10,y+8,w-20,6);g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=4;g.beginPath();g.roundRect(x,y,w,h,14);g.stroke()}
function crown(x,y,s){g.fillStyle='#e8c547';g.beginPath();g.moveTo(x-s,y);g.lineTo(x-s,y-s*0.9);g.lineTo(x-s*0.5,y-s*0.45);g.lineTo(x,y-s*1.1);g.lineTo(x+s*0.5,y-s*0.45);g.lineTo(x+s,y-s*0.9);g.lineTo(x+s,y);g.fill();
  g.fillStyle='#c0392b';g.beginPath();g.arc(x,y-s*0.35,s*0.16,0,7);g.fill();g.strokeStyle='#7a5a10';g.lineWidth=3;g.stroke()}
function mvpCard(cx,cy,p,label,stat,col){const k=ease.back(Math.min(1,(NOW-round.endT-0.35)/0.35));if(k<=0)return;
  g.save();g.translate(cx,cy);g.scale(k,k);g.translate(-cx,-cy);
  g.fillStyle='rgba(14,16,20,.88)';g.beginPath();g.roundRect(cx-230,cy-80,460,200,22);g.fill();g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.roundRect(cx-228,cy-78,456,196,20);g.stroke();
  glow(cx,cy-10,110,'rgba(255,220,140,1)',0.25);
  avatar(p,cx,cy-18,50,col);crown(cx,cy-80,30);
  txt(label,cx,cy+80,28,col,'center',700);txt(`${short(p.name,12)}  ${stat}`,cx,cy+112,30,'#fff','center',600);g.restore()}
function drawResult(){const w=round.win==='h',col=w?COL.h:COL.z,el=NOW-round.endT,k=ease.back(Math.min(1,el/0.4));
  g.fillStyle=`rgba(8,8,12,${0.55*Math.min(1,el/0.3)})`;g.fillRect(0,0,W,H);
  g.save();g.translate(540,640);g.rotate(NOW*0.4);g.globalAlpha=0.18;g.fillStyle=col;for(let i=0;i<14;i++){g.rotate(Math.PI/7);g.beginPath();g.moveTo(0,0);g.lineTo(-60,-700);g.lineTo(60,-700);g.fill()}g.restore();g.globalAlpha=1;
  glow(540,640,380,w?'rgba(120,180,255,1)':'rgba(150,220,100,1)',0.35);
  g.save();g.translate(540,640);g.scale(k,k);g.translate(-540,-640);
  txt(w?'ป้อมรอด!':'ป้อมแตก!',540,560,96,w?'#f0c86a':'#e5566b','center',700,'#1a1408');
  ribbon(540,660,700,120,w?'#7fb8f5':'#a8d870',w?'#3d6fb0':'#5a8a2c');
  txt(w?'ฝั่งคนชนะ':'ฝั่งซอมบี้ชนะ',540,684,70,'#fff','center',700,'#14202e');
  g.restore();
  const both=round.mvpH&&round.mvpZ;
  if(round.mvpH)mvpCard(both?300:540,880,round.mvpH,'ยิงเก่งสุด',`${round.mvpH.kills} ตัว`,COL.h);
  if(round.mvpZ)mvpCard(both?780:540,880,round.mvpZ,'ซอมบี้ตัวแสบ',`${Math.round(round.mvpZ.rz)} แต้ม`,COL.z);
  const left=Math.max(0,Math.ceil(INTER-el));g.fillStyle='rgba(14,16,20,.85)';g.beginPath();g.roundRect(390,1060,300,56,28);g.fill();
  txt(`รอบต่อไปใน ${left}`,540,1100,32,'#fff','center',600)}

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=name,i=2;while(used[n]&&used[n]!==id)n=`${name}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){
  if(ev.type==='status'){live={...live,...ev};return}
  const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);
  else if(ev.type==='like')like(name,ev.count||1,ev.pic);
  else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic);
  else if(ev.type==='follow')follow(name,ev.pic,ev.repeat);
}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};
  ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}

document.fonts.load(`700 40px Kanit`).finally(()=>requestAnimationFrame(loop));
