<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<title>จุดเทียนไล่ผี LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100vh;aspect-ratio:9/16}

#ui{pointer-events:none}

</head><body><div id="wrap"><canvas id="gl"></canvas><canvas id="ui" width="1080" height="1920"></canvas></div>
<script type="module">
import * as THREE from '/vendor/three/build/three.module.js';
import {EffectComposer} from '/vendor/three/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from '/vendor/three/examples/jsm/postprocessing/RenderPass.js';
import {UnrealBloomPass} from '/vendor/three/examples/jsm/postprocessing/UnrealBloomPass.js';
import {OutputPass} from '/vendor/three/examples/jsm/postprocessing/OutputPass.js';
// ===== จุดเทียนไล่ผี: เข้าห้อง = ได้เทียนชื่อตัวเอง (ยังไม่ติด) กดหัวใจ 1 ดวง = จุด พิมพ์อะไรก็ได้ = จุด เทียนค่อยๆ หมด แสงน้อย ผีจะคืบเข้ามา =====
// ฉาก 2 มิติ: ภาพศาลาสองแบบจาก Codex (ไฟอุ่น/ไฟดับ) ผสมตามแสงรวม เทียน ผี ตะเกียง คบไฟ เป็นภาพตัดพื้น เปลวไฟและแสงวาดด้วยโค้ด
// ไม่มีพระ พระพุทธรูป หรือของทางศาสนา ผีไม่มีเลือด ไม่มีแผล  ?test=1 ปุ่มทดสอบ  ?demo=1 คนดูจำลอง  ?safe=1 ระบายส่วนที่ TikTok บัง
const Q=new URLSearchParams(location.search),DEMO=Q.has('demo')||Q.has('test'),SHOWSAFE=Q.has('safe');
const W=1080,H=1920,FONT='Kanit, Tahoma, sans-serif',SAFE_T=72,SAFE_B=1390;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
const short=(s,n=10)=>s.length>n?s.slice(0,n)+'…':s;
const ease={out:k=>1-(1-k)*(1-k),back:k=>{const c=1.7;k-=1;return 1+k*k*((c+1)*k+c)}};
let NOW=0,live={state:DEMO?'demo':'connecting'};
const cv=document.getElementById('ui'),g=cv.getContext('2d');
const MODEL=false;let PRESIM=false;

// ---------- ภาพ ----------
const IMG={};for(const n of ['plate_warm.jpg','plate_cold.jpg','ghost_face.jpg','candle.png','candle_gold.png','oil_lamp.png','torch.png','ghost_far.png','ghost_walk.png','ghost_reach.png','ghost_recoil.png']){const im=new Image();im.src='/art/ghost/'+n;IMG[n.split('.')[0]]=im}
const ok=im=>im&&im.complete&&im.naturalWidth;

// ---------- พื้นศาลา: แถวเทียน 4 แถว ไกล->ใกล้ (พิกัดจอ 1080x1920 วัดจากภาพศาลา) ----------
// แถว: [z, จำนวน, ครึ่งความกว้าง] พิกัดโลก (เมตร) ตำแหน่งบนจอคำนวณใหม่ทุกเฟรมใน syncScene
const ROWS=[[-7.3,6,3.0],[-6.0,7,2.8],[-4.6,7,2.5],[-3.2,8,2.1]],SLOTS=[];
ROWS.forEach(([z,n,hw],ri)=>{for(let i=0;i<n;i++){const u=(i+0.5+(ri%2?0.22:-0.08))/n;SLOTS.push({wx:lerp(-hw,hw,u)+rnd(-0.12,0.12),wz:z+rnd(-0.25,0.25),sc:lerp(0.55,1,ri/3),row:ri,c:null,x:0,y:0,s:1})}});

// ---------- คนดู ----------
let P={};
const SHIRTS=['#a85a4a','#4a6a8a','#8a7a4a','#6a4a7a','#4a7a6a','#9a6a3a'];
function setPic(p,url){if(!url||p.picUrl===url)return;p.picUrl=url;const im=new Image();im.referrerPolicy='no-referrer';im.src=url;p.pic=im}
function player(name,pic){let p=P[name];if(!p)p=P[name]={name,hearts:0,coins:0,last:NOW,shirt:pick(SHIRTS)};setPic(p,pic);p.last=NOW;return p}
const BAD=['ควย','เหี้ย','สัส','สัด','เย็ด','หี','แตด','ไอ้สัตว์','อีสัตว์','ระยำ','ชาติหมา','พ่อมึงตาย','แม่มึงตาย','กระหรี่','ร่าน','fuck','shit','bitch','porn','sex','dick','pussy','nigg'];
const clean=s=>!BAD.some(b=>String(s).toLowerCase().includes(b));

// ---------- เทียน ----------
let candles=[];   // {p,slot,fuel,lit,born,warnT,boost,gold,lamp,lampT,bubble,bubbleT,outT,amb}
const BURN=1/85;  // เทียนเต็มดวงอยู่ได้ราว 85 วิ
function freeSlot(front){const f=SLOTS.filter(s=>!s.c);if(f.length)return front?f.sort((a,b)=>b.row-a.row||Math.random()-0.5)[0]:pick(f);
  // เต็ม: เอาเทียนของศาลา หรือเทียนที่ดับนานที่สุดออก
  const v=candles.filter(c=>c.amb).concat(candles.filter(c=>!c.lit&&!c.gold&&c.p).sort((a,b)=>a.p.last-b.p.last))[0];if(!v)return null;dropCandle(v);return v.slot}
function dropCandle(c){if(c.m)scene.remove(c.m.g);c.slot.c=null;candles=candles.filter(x=>x!==c);if(c.p&&c.p.candle===c)c.p.candle=null}
function candleOf(p,create=true){if(p.candle)return p.candle;if(!create)return null;const s=freeSlot(false);if(!s)return null;const c={p,slot:s,fuel:0,lit:false,born:NOW,warnT:0,boost:0,ph:rnd(0,9)};s.c=c;candles.push(c);p.candle=c;return c}
function light(c,fuel,quiet){const was=c.lit;c.lit=true;c.fuel=Math.max(c.fuel,fuel);c.outT=0;if(!was){c.litT=NOW;if(!quiet)sfxAt('candle_light',0.6,0,0.15);spark(c,10)}}
function blowOut(c){if(!c.lit||c.gold)return;c.lit=false;c.fuel=0;c.outT=NOW;smoke(c,1)}
// เทียนของศาลา (ไม่มีชื่อ ไม่ใช่คนดู) ให้ศาลาไม่มืดตอนยังไม่มีคนเล่น ดับแล้วจุดเองใหม่
const NPC={level:Q.has('npc')?clamp(+Q.get('npc')|0,0,2):1};
function ambTick(){const want=[0,5,9][NPC.level],have=candles.filter(c=>c.amb);
  if(have.length>want)dropCandle(have[0]);else if(have.length<want&&SLOTS.some(s=>!s.c)){const s=pick(SLOTS.filter(s=>!s.c));const c={amb:1,slot:s,fuel:rnd(0.4,1),lit:true,born:NOW,ph:rnd(0,9),boost:0};s.c=c;candles.push(c)}
  for(const c of have)if(!c.lit&&NOW-c.outT>rnd(18,30))light(c,rnd(0.6,1),true)}

// ---------- แสงรวมของศาลา ----------
let lamps=[];     // {kind:'oil'|'torch', x,y,s, until, p}
let L=0.6,dawnUntil=-99,dawnT=-99;
function lightLevel(){let sum=0;for(const c of candles)if(c.lit)sum+=(c.gold?1.2:c.amb?0.6:1)*clamp(c.fuel,0.25,1);for(const l of lamps)sum+=l.kind==='torch'?4:1.5;
  const real=candles.filter(c=>c.p).length,need=Math.max(4,real*0.6+2.5);return clamp(sum/need,0,1)}

// ---------- ผี ----------
const G={d:0.05,x:0,tx:0,cool:0,recoilT:-9,goneUntil:-9,blowNext:20,scareNext:30,warn:null,glitchT:0,vis:1,gustNext:rnd(70,100)};
function ghostPose(){if(NOW<G.recoilT)return 'ghost_recoil';return G.d<0.3?'ghost_far':G.d<0.68?'ghost_walk':'ghost_reach'}
function push(amount,why){G.d=Math.max(0,G.d-amount);G.recoilT=NOW+1.6;G.cool=Math.max(G.cool,NOW+6);if(G.warn){G.warn.warnT=0;G.warn=null}sfxAt('ghost_hiss',0.75,0.05,1)}
let jump=null;  // ผีโผล่ชิดจอ
function attack(frac=0.75){if(NOW<G.scareNext){blowRow(0.5);G.d=0.6;G.cool=NOW+8;return}
  jump={t:NOW};G.scareNext=NOW+45;G.d=0.97;G.cool=NOW+3;sfx('ghost_scream',0.9);duck(3);
  setTimeout(()=>{blowRow(frac);G.d=0.3;G.cool=NOW+16;sfxAt('ghost_laugh',0.7,0.8);mcSay(pick(['เธอเป่าเทียนดับไปหลายเล่มแล้ว ช่วยกันกดหัวใจจุดใหม่เร็ว','อย่าปล่อยให้ไฟดับอีก กดหัวใจจุดเทียนของคุณไว้']),{pri:1,ttl:12})},700)}
function blowRow(frac){const lit=candles.filter(c=>c.lit&&!c.gold);for(const c of lit)if(Math.random()<frac)blowOut(c);sfxAt('candle_blow',0.9,0,0.5)}
function updGhost(dt){
  if(NOW<dawnUntil||NOW<G.goneUntil){G.d=0;G.vis=Math.max(0,G.vis-dt*1.5);G.warn=null;return}G.vis=Math.min(1,G.vis+dt*0.6);
  if(NOW>=G.cool){G.d=clamp(G.d+(0.42-L)*0.04*dt,0,1)}else G.d=Math.max(0,G.d-dt*0.02);
  // เดินส่ายไปมา และเข้าหาเทียนที่จะเป่า
  if(G.warn)G.tx=G.warn.slot.wx;else if(Math.random()<dt*0.25)G.tx=rnd(-2.5,2.5);
  const gold=candles.find(c=>c.gold&&Math.abs(c.slot.wx-G.x)<1.2&&G.d>0.55);if(gold&&NOW>G.recoilT+2){G.recoilT=NOW+1.2;G.tx=G.x+(G.x<gold.slot.wx?-2:2)}
  G.x+=(clamp(G.tx,-3.6,3.6)-G.x)*Math.min(1,dt*0.6);
  if(Math.random()<dt*0.12)G.glitchT=NOW+0.12;
  // ใกล้แล้วเลือกเป่าเทียนทีละเล่ม: ขึ้นเตือนที่เทียนเล่มนั้น 3 วิ เจ้าของกดหัวใจทันก็รอด
  if(G.d>0.5&&!G.warn&&NOW>G.blowNext){const lit=candles.filter(c=>c.lit&&!c.gold&&c.p);if(lit.length){const c=lit.sort((a,b)=>Math.abs(a.slot.wx-G.x)-Math.abs(b.slot.wx-G.x))[0];c.warnT=NOW;G.warn=c;sfxAt('ghost_whisper',0.7,0,2);
      if(MC.q.length<3)mcSay(pick(['เทียนของคุณ{n} กำลังจะดับ กดหัวใจเร็ว','คุณ{n} เธออยู่ข้างเทียนของคุณแล้ว','ระวังนะคุณ{n} เธอจะเป่าเทียนของคุณ']),{n:c.p.name,f:'มีเทียนกำลังจะดับ กดหัวใจเร็ว',pri:1,ttl:6})}
    G.blowNext=NOW+lerp(11,4,G.d)}
  if(G.warn&&NOW-G.warn.warnT>3.2){const c=G.warn;G.warn=null;c.warnT=0;if(candles.includes(c)){blowOut(c);sfx('candle_blow',0.8);sfxAt('ghost_laugh',0.5,0.4,4)}}
  if(G.d>=1)attack();
  // ลมกรรโชก: เทียนทุกเล่มเหลือครึ่ง ให้ห้องต้องช่วยกันเติม
  if(NOW>G.gustNext){G.gustNext=1e12;for(const c of candles)if(!c.gold)c.fuel*=0.55;gustT=NOW;banner('ลมเย็นพัดเข้ามา','#9fc4ff','เทียนทุกเล่มเหลือครึ่ง กดหัวใจเติมไฟ');sfxAt('ghost_whisper',0.8)}}
let gustT=-9;
const isWarn=c=>G.warn===c||(c.warnBy&&c.warnBy.target===c&&c.warnBy.warnT);

// ---------- ผีบริวาร: คนเล่นพร้อมกันตั้งแต่ 6 คน มีผีตัวเล็กกว่าเข้ามาแยกกันเป่าเทียนคนละมุม (สูงสุด 3) แสงไม่ช่วย เจ้าของต้องกดหัวใจเอง ----------
let minions=[],minionNext=25;
const activeN=()=>candles.filter(c=>c.p&&c.lit&&NOW-c.p.last<60).length;
const minionWant=()=>{const n=activeN();return n<6?0:Math.min(3,Math.floor((n-2)/4))};
function updMinions(dt){const calm=NOW<dawnUntil||NOW<G.goneUntil;
  if(!calm&&NOW>minionNext&&minions.filter(m=>!m.dead).length<minionWant()){minionNext=NOW+rnd(10,18);const side=Math.random()<0.5?-1:1;
    minions.push({x:side*rnd(1.5,3),z:-11,tx:0,tz:-7,vis:0,born:NOW,life:rnd(50,75),target:null,warnT:0,recoilT:-9,pose:'ghost_walk',ph:rnd(0,9)});sfxAt('ghost_whisper',0.6,0,3);
    if(MC.q.length<3)mcSay(pick(['มีอีกตัวเข้ามาแล้ว ระวังเทียนของคุณให้ดี','ไม่ได้มีตัวเดียว ดูเทียนของตัวเองไว้']),{ttl:8})}
  for(const m of minions){if(calm||NOW-m.born>m.life)m.dead=true;
    if(m.dead){m.vis-=dt*1.2;if(m.target){m.target.warnBy=null;m.target.warnT=0;m.target=null}continue}m.vis=Math.min(1,m.vis+dt*0.7);
    if(NOW<m.recoilT){m.pose='ghost_recoil';m.z-=dt*1.5;continue}
    if(!m.target||!candles.includes(m.target)||!m.target.lit||m.target.gold){if(m.target){m.target.warnBy=null;m.target.warnT=0}const taken=new Set([G.warn,...minions.map(q=>q.target)]);const lit=candles.filter(c=>c.p&&c.lit&&!c.gold&&!taken.has(c));m.target=lit.length?pick(lit):null;m.warnT=0;if(!m.target){m.tx=m.x;m.tz=-8}}
    if(m.target){const s=m.target.slot;m.tx=s.wx+(m.x<s.wx?-0.55:0.55);m.tz=s.wz-0.35}
    m.pose=m.warnT?'ghost_reach':'ghost_walk';
    const dx=m.tx-m.x,dz=m.tz-m.z,d=Math.hypot(dx,dz);if(d>0.05){const sp=Math.min(d,1.1*dt);m.x+=dx/d*sp;m.z+=dz/d*sp}
    if(m.target&&d<0.25){if(!m.warnT){m.warnT=NOW;m.target.warnT=NOW;m.target.warnBy=m;sfxAt('ghost_whisper',0.6,0,1.5);
        if(MC.q.length<3)mcSay(pick(['คุณ{n} มีผียืนข้างเทียนของคุณ กดหัวใจเร็ว','เทียนของคุณ{n}กำลังจะดับ']),{n:m.target.p.name,f:'มีเทียนกำลังจะดับ กดหัวใจเร็ว',pri:1,ttl:6})}
      else if(NOW-m.warnT>3.4){const c=m.target;c.warnBy=null;c.warnT=0;blowOut(c);sfx('candle_blow',0.8);sfxAt('ghost_laugh',0.4,0.3,5);m.target=null;m.warnT=0}}}
  minions=minions.filter(m=>!(m.dead&&m.vis<=0))}

// ---------- เที่ยงคืน ผีออกล่า: ทุก 4-5 นาที 40 วิ แสงไม่ช่วย ทั้งห้องต้องกดหัวใจครบเป้า (ตามจำนวนคน) ----------
const HUNT={on:false,t0:0,dur:40,need:0,got:0,next:+(Q.get('hunt')||150),d0:0};
function huntTick(){if(!HUNT.on){if(NOW>HUNT.next&&activeN()>=1&&NOW>dawnUntil&&NOW>G.goneUntil){HUNT.on=true;HUNT.t0=NOW;HUNT.need=Math.min(1500,40+30*activeN());HUNT.got=0;HUNT.d0=Math.min(G.d,0.5);G.cool=0;
      banner('เที่ยงคืนแล้ว ผีออกล่า!','#ff5a5a',`ช่วยกันกดหัวใจ ${HUNT.need} ดวง ภายใน 40 วิ`);sfx('ghost_scream',0.45);duck(2);
      mcSay('เที่ยงคืนแล้ว เธอออกล่า แสงช่วยไม่ได้แล้ว ทุกคนช่วยกันกดหัวใจให้ครบ ไม่งั้นเทียนดับทั้งศาลา',{pri:1,ttl:15})}else if(NOW>HUNT.next)HUNT.next=NOW+20;return}
  const k=(NOW-HUNT.t0)/HUNT.dur;G.d=Math.max(G.d,lerp(HUNT.d0,0.99,Math.min(1,k)));
  if(HUNT.got>=HUNT.need){HUNT.on=false;HUNT.next=NOW+rnd(240,300);push(1);G.goneUntil=NOW+30;for(const c of candles){light(c,1.2,true);c.boost=2}confettiBurst(180);sfx('hgoal',1);sfxAt('clapb',0.85,0.8,2);duck(5);
    banner('ไล่ผีสำเร็จ!','#9fe08a','ทุกคนช่วยกันได้ เธอหายไป 30 วิ');mcSay('ไล่ผีสำเร็จ ทุกคนช่วยกันได้ เธอหนีไปแล้ว',{pri:1,ttl:15})}
  else if(k>=1){HUNT.on=false;HUNT.next=NOW+rnd(240,300);G.scareNext=0;attack(0.9);mcSay('ไม่ทัน เธอเป่าเทียนดับเกือบหมดแล้ว ช่วยกันจุดใหม่',{pri:1,ttl:12})}}

// ---------- อนุภาค: ประกาย ควัน หัวใจ พลุประทัด ----------
let parts=[];
function spark(c,n){const s=c.slot;for(let i=0;i<n;i++)parts.push({k:'spark',x:s.x,y:s.y-80*s.s,vx:rnd(-90,90),vy:rnd(-160,-40),t:NOW,life:rnd(0.5,0.9),c:'#ffd27a'})}
function smoke(c,n){const s=c.slot;for(let i=0;i<14*n;i++)parts.push({k:'smoke',x:s.x+rnd(-4,4),y:s.y-78*s.s,vx:rnd(-12,12),vy:rnd(-60,-30),t:NOW+i*0.06,life:rnd(1.6,2.6),r:rnd(5,9)*s.s})}
function hearts(c,n){const s=c.slot;for(let i=0;i<Math.min(6,n);i++)parts.push({k:'heart',x:s.x+rnd(-20,20),y:s.y-110*s.s,vx:rnd(-20,20),vy:rnd(-140,-90),t:NOW+i*0.05,life:1})}
function crackers(){for(let i=0;i<26;i++)setTimeout(()=>{const s=pick(SLOTS);for(let j=0;j<16;j++)parts.push({k:'spark',x:s.x+rnd(-20,20),y:s.y-10,vx:rnd(-260,260),vy:rnd(-320,-60),t:NOW,life:rnd(0.4,0.8),c:pick(['#ff5a3a','#ffd04a','#fff2c0'])});flashT=NOW},i*110)}
let flashT=-9;
function updParts(dt){for(const q of parts){if(NOW<q.t)continue;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.k==='spark')q.vy+=420*dt;if(q.k==='smoke'){q.vx+=Math.sin(NOW*2+q.y*0.05)*8*dt;q.r+=dt*7}}parts=parts.filter(q=>NOW<q.t+q.life)}

// ---------- รับเหตุการณ์ ----------
const CFG={mc:1,welcome:1,gap:16,goal:1};
let liveHearts=0,msIdx=0,lastChat=-99,banners=[],cards=[],litTotal=0;
const MS_G=i=>Math.round(([120,350,700,1200,2000][i]??2000+(i-4)*1200)*CFG.goal);
function touch(p){p.last=NOW;welcome(p.name)}
function comment(name,text,pic){const p=player(name,pic),c=candleOf(p);lastChat=NOW;evComment(p,String(text||''));if(!c)return;const first=!c.lit;light(c,1);c.boost=1;
  const t=String(text||'').replace(/\s+/g,' ').trim();if(t&&clean(t)&&t.replace(/[\d\s.!?]/g,'').length>=1){c.bubble=t.slice(0,30);c.bubbleT=NOW}

  SND.bus=c.createGain();const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;SND.bus.connect(comp).connect(SND.master);
  fetch('/sounds').then(r=>r.json()).then(d=>{Object.keys(d.list||{}).forEach(k=>{if(!SKEYS.test(k))return;
    fetch(`/sfx/${k}_${(d.choice||{})[k]||'a'}.mp3`).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>c.decodeAudioData(b)).then(a=>{SND.buf[k]=a}).catch(()=>{})})}).catch(()=>{});
  const resume=()=>{if(SND.ctx.state!=='running')SND.ctx.resume()};addEventListener('pointerdown',resume);addEventListener('keydown',resume)}

  const s=c.createBufferSource();s.buffer=b;s.playbackRate.value=rate;const gn=c.createGain();gn.gain.value=vol;s.connect(gn).connect(SND.bus);voices++;s.onended=()=>voices--;s.start()}

const gapLast={};function sfxAt(k,vol,delay=0,gap=0){setTimeout(()=>{const t=performance.now()/1000;if(gap&&t-(gapLast[k]||0)<gap)return;gapLast[k]=t;sfx(k,vol)},delay*1000)}

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=clean(name)?name:'ผู้ใช้',i=2;const base=n;while(used[n]&&used[n]!==id)n=`${base}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){if(ev.type==='status'){live={...live,...ev};return}if(ev.type==='control'){control(ev);return}const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);else if(ev.type==='like')like(name,ev.count||1,ev.pic);else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic,ev.gift,ev.count||1);else if(ev.type==='follow')follow(name,ev.pic,ev.repeat);else if(ev.type==='join')joined(name,ev.pic)}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);wsRef=ws;ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}

// ---------- loop ----------
let last=performance.now(),errN=0,fpsN=0,fpsT0=performance.now(),fpsNow=0,ambT=0;
function loop(t){requestAnimationFrame(loop);const dt=clamp((t-last)/1000,0,0.05);last=t;NOW+=dt;
  fpsN++;if(t-fpsT0>2000){fpsNow=fpsN*1000/(t-fpsT0);fpsN=0;fpsT0=t}
  try{if(crowdOn)sim();if((ambT-=dt)<=0){ambT=1;ambTick()}L+=(lightLevel()-L)*Math.min(1,dt*1.5);updCandles(dt);huntTick();evTick();updGhost(dt);updMinions(dt);updParts(dt);musicTick();mcIdle(dt);syncScene(dt);draw()}catch(e){if(errN++<5)console.error(e)}}
document.fonts.load('700 40px Kanit').finally(()=>{last=performance.now();requestAnimationFrame(loop)});
