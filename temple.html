function P(geo,m){const g=geo.index?geo.toNonIndexed():geo.clone();if(m)g.applyMatrix4(m);return g}

function limb(a,b,r1,r2,seg=16){const A=V3(...a),d=V3(...b).sub(A),L=d.length(),g=new THREE.CylinderGeometry(r2,r1,L,seg,1,true);g.translate(0,L/2,0);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V3(0,1,0),d.normalize()));g.translate(A.x,A.y,A.z);return P(g)}
function lathe(pr,seg=40,sz=1,dy=0,sx=1){const g=new THREE.LatheGeometry(pr.map(([r,y])=>new THREE.Vector2(r,y)),seg);g.scale(sx,1,sz);g.translate(0,dy,0);return P(g)}

// ---------- วัสดุปิดทอง: เนื้อปูน/หิน/สำริดเดิม แล้วทองคำเปลวแปะเป็นแผ่นสี่เหลี่ยมทีละแผ่นตามค่า prog (0-1) ----------
// shine = แถบแสงวิ่งขึ้นตอนปิดทองครบ  glow = เรืองเบาๆ หลังครบ
const GILD_GLSL=`varying vec3 vOP;uniform float prog,shine,glow;uniform vec3 base;float gk;
float h31(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}`;
function gildMat(baseHex){const u={prog:{value:0},base:{value:new THREE.Color(baseHex)},shine:{value:-99},glow:{value:0}};
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.85,metalness:0,side:THREE.DoubleSide});
  m.onBeforeCompile=sh=>{Object.assign(sh.uniforms,u);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vOP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvOP=position;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\n'+GILD_GLSL)
      .replace('#include <color_fragment>',`#include <color_fragment>
        float nz=vn(vOP*2.3);vec3 q=vOP*9.5+vec3(nz*2.2);float cell=h31(floor(q)+.5);
        float edge=(vn(vOP*28.0)-.5)*.05;gk=smoothstep(cell-.012,cell+.012,prog*1.04-.02+edge);
        vec3 bc=base*(.8+.32*vn(vOP*4.0))*(.92+.1*vn(vOP*31.0));
        float sp=vn(vOP*55.0);vec3 gc=vec3(1.0,.70,.24)*(.9+.25*sp);
        diffuseColor.rgb=mix(bc,gc,gk);`)
      .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=mix(.86,.3+.14*vn(vOP*44.0),gk);')
      .replace('#include <metalnessmap_fragment>','#include <metalnessmap_fragment>\nmetalnessFactor=gk*.8;')
      .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
        float sb=exp(-pow((vOP.y-shine)*2.0,2.0));totalEmissiveRadiance+=vec3(1.0,.7,.28)*gk*(.07+sb*1.2+glow*.16);`)};
  m.userData.u=u;return m}

// ---------- ปั้นองค์พระ (หน่วย: ความสูงนั่งราว 3.9) ----------
function figureParts(sp){const B=[],pose=sp.pose,st=!(pose==='med'||pose==='earth'),dy=st?1.8:0,hy=2.55+dy,pl=sp.plump?1.08:1;
  if(!st){
    B.push(ell(1.45,.36,.8,0,.36,.22),ell(.42,.3,.44,1.18,.32,.48),ell(.42,.3,.44,-1.18,.32,.48),
      limb([1.12,.42,.66],[-.32,.5,.8],.2,.16),limb([-1.12,.46,.58],[.36,.66,.7],.2,.16),ell(.13,.07,.3,-.52,.7,.64,0,.4,0),ell(1.25,.1,.32,0,.2,.88));
  }else{
    B.push(lathe([[.001,0],[.42,0],[.5,.12],[.53,.7],[.5,1.3],[.48,1.85],[.56,2.32],[.001,2.32]],40,.72));
    if(pose==='walk')B.push(ell(.12,.08,.26,-.19,.06,.38),ell(.12,.08,.24,.19,.16,.12,-.5,0,0));else B.push(ell(.12,.08,.26,.19,.06,.3),ell(.12,.08,.26,-.19,.06,.3));
    B.push(ell(.17,.9,.05,0,1.15,.37));
  }
  // ลำตัว คอ จีวร
  B.push(lathe([[.001,.5],[.58*pl,.5],[.6*pl,.8],[.58*pl,1.1],[.63*pl,1.4],[.73,1.66],[.8,1.8],[.7,1.94],[.42,2.02],[.2,2.05],[.001,2.06]].map(([r,y])=>[r,y]),40,.62,dy));
  B.push(cyl(.19,.2,.32,0,2.12+dy,0,20));
  B.push(box(.24,1.05,.05,-.33,1.45+dy,.41,0,0,.245),ell(.13,.09,.04,-.2,.92+dy,.43));
  B.push(limb([.56,1.3+dy,.33],[-.3,1.98+dy,.24],.035,.035,8));
  if(sp.crown){
    B.push(ell(.4,.47,.43,0,hy,.02));
    B.push(lathe([[.001,0],[.46,0],[.45,.12],[.39,.22],[.35,.42],[.29,.62],[.21,.9],[.12,1.2],[.055,1.45],[.02,1.66],[.001,1.72]],32,1,hy+.16));
    for(const [r,y] of [[.4,.24],[.33,.5],[.25,.78],[.16,1.06],[.09,1.32]])B.push(P(new THREE.TorusGeometry(r,.03,6,32),M4(0,hy+.16+y,0,Math.PI/2)));
    B.push(P(new THREE.TorusGeometry(.43,.04,8,40),M4(0,hy+.2,0,Math.PI/2,0,0,1,1,1.03)));
    for(const s of [1,-1])B.push(P(new THREE.ConeGeometry(.1,.42,10),M4(s*.44,hy+.08,-.06,0,0,-s*.35)));
    B.push(P(new THREE.TorusGeometry(.52,.05,8,24,Math.PI),M4(0,1.88+dy,.02,Math.PI/2+.32,0,0,1,1,.72)),ell(.09,.12,.05,0,1.62+dy,.42));
    B.push(P(new THREE.TorusGeometry(.6,.045,8,40),M4(0,.56+dy,0,Math.PI/2,0,0,1,1,.62)));
  }else{
    B.push(ell(.4,.47,.43,0,hy,.02),ell(.42,.42,.44,0,hy+.09,-.07));
    // เม็ดพระศก: จุดบนผิวผม เฉพาะที่ไม่จมในหน้า
    const inHead=(x,y,z)=>(x/.4)**2+((y-hy)/.47)**2+((z-.02)/.43)**2<1.03,N=180;
    for(let i=0;i<N;i++){const yy=1-2*(i+.5)/N,r=Math.sqrt(1-yy*yy),a=i*2.39996;if(yy<-.1)continue;const x=Math.cos(a)*r*.43,y=hy+.09+yy*.43,z=-.07+Math.sin(a)*r*.45;if(inHead(x,y,z))continue;B.push(ell(.052,.052,.052,x,y,z,0,0,0,true))}
    B.push(ell(.21,.19,.21,0,hy+.6,-.07));
    for(let i=0;i<44;i++){const yy=1-2*(i+.5)/44,r=Math.sqrt(1-yy*yy),a=i*2.39996;if(yy<-.35)continue;B.push(ell(.045,.045,.045,Math.cos(a)*r*.22,hy+.6+yy*.2,-.07+Math.sin(a)*r*.22,0,0,0,true))}
    if(sp.top==='flame')B.push(lathe([[.001,0],[.1,.02],[.12,.12],[.08,.3],[.045,.48],[.001,.66]],20,1,hy+.74));
    else if(sp.top==='bud')B.push(ell(.1,.14,.1,0,hy+.84,-.07));
  }
  for(const s of [1,-1])B.push(ell(.075,.33,.13,s*.41,hy-.1,0,0,0,s*.08));
  B.push(ell(.06,.15,.07,0,hy-.04,.42),ell(.1,.03,.05,0,hy-.2,.38));
  // แขน
  const arm=(s,e,w,hand)=>{B.push(ell(.22,.22,.22,...s),limb(s,e,.2,.155),ell(.16,.16,.16,...e),limb(e,w,.15,.11));if(hand)B.push(hand)};
  const S=x=>[x*.74,1.8+dy,-.02];
  if(pose==='med'){arm(S(1),[1,1.06,.15],[.3,.76,.55]);arm(S(-1),[-1,1.06,.15],[-.3,.76,.55]);B.push(ell(.3,.08,.19,0,.74,.6),ell(.28,.07,.17,0,.81,.62))}
  else if(pose==='earth'){arm(S(1),[1.02,1.08,.2],[1.12,.62,.76],ell(.1,.24,.14,1.13,.44,.84,.25,0,0));arm(S(-1),[-1,1.06,.15],[-.25,.76,.55],ell(.24,.08,.18,-.12,.74,.6))}
  else{
    const down=s=>{arm(S(s),[s*.86,2.82,.06],[s*.78,2.12,.22],ell(.1,.24,.13,s*.77,1.92,.24));B.push(ell(.13,.78,.06,s*.64,2.15,.14))};
    const up=s=>{arm(S(s),[s*.92,2.86,.12],[s*.86,3.38,.44],ell(.13,.25,.06,s*.86,3.6,.48));B.push(ell(.13,.72,.06,s*.92,2.2,.1))};
    if(pose==='abhaya'){up(1);down(-1)}

  const big=t.coins>=30,gr=g.createLinearGradient(140,0,940,0);gr.addColorStop(0,'rgba(140,90,10,0)');gr.addColorStop(.18,big?'rgba(200,130,20,.95)':'rgba(150,95,15,.9)');gr.addColorStop(.82,big?'rgba(200,130,20,.95)':'rgba(150,95,15,.9)');gr.addColorStop(1,'rgba(140,90,10,0)');
  g.fillStyle=gr;g.fillRect(140,y,800,56);avatar(t.p,300,y+28,22,'#fff0b0');txt('ขอบคุณ',332,y+38,24,'#fff8e0','left',600);txt(short(t.p.name,11),424,y+39,30,'#fff2a0','left',700);
  if(!drawImg(t.icon,760,y+28,46*pp))txt(t.coins?`${t.coins}`:'ติดตาม',760,y+38,26,'#fff','center',700);if(t.n>1)txt(`x${t.n}`,800,y+40,30*pp,'#fff','left',700);g.globalAlpha=1})}
// ฉากเปิดขบวนแห่: ประกาศชื่อเต็มจอ 4.6 วิ แล้วย่อเป็นแถบแดงค้างบนจอจนขบวนผ่าน
let coinsFx=[];
function drawCoins(){coinsFx=coinsFx.filter(c=>c.y<H+40);for(const c of coinsFx){c.y+=c.v/60;c.r+=.15;g.save();g.translate(c.x,c.y);g.scale(Math.cos(c.r),1);g.fillStyle='#ffc83a';g.beginPath();g.arc(0,0,c.s,0,7);g.fill();g.strokeStyle='#a86a10';g.lineWidth=3;g.stroke();g.restore()}}
function drawParadeIntro(){const P0=PARADE;if(!P0)return;const t=NOW-P0.t0,p=P0.p;
  if(t<4.6){const a=clamp(Math.min(t*3,(4.6-t)*2.5),0,1),k=ease.back(Math.min(1,t/.45));g.globalAlpha=a*.55;g.fillStyle='#1a0800';g.fillRect(0,0,W,H);g.globalAlpha=a;
    g.save();g.translate(540,760);g.rotate(NOW*.25);for(let i=0;i<24;i++){g.rotate(Math.PI/12);g.fillStyle=i%2?'rgba(255,210,110,.28)':'rgba(255,240,190,.16)';g.beginPath();g.moveTo(0,0);g.lineTo(900,-60);g.lineTo(900,60);g.fill()}g.restore();drawCoins();
    if(t<3.5&&Math.random()<.35)coinsFx.push({x:rnd(60,1020),y:-30,v:rnd(500,800),r:rnd(0,6),s:rnd(18,30)});
    g.save();g.translate(540,760);g.scale(k,k);g.translate(-540,-760);
    txt(P0.title,540,520,46,'#ffe08a','center',700);txt('ขอเสียงปรบมือดังๆ ให้',540,580,30,'#fff','center',600);
    const r=120;g.globalAlpha=a*(.5+.2*Math.sin(NOW*6));g.fillStyle='#ffd870';g.beginPath();g.arc(540,760,r+36,0,7);g.fill();g.globalAlpha=a;avatar(p,540,760,r,'#ffd04a');garland(540,760,r);crown(540,760-r-40,90);
    let fs=96;g.font=`700 ${fs}px ${FONT}`;const nm=short(p.name,14);while(g.measureText(nm).width>980&&fs>48){fs-=6;g.font=`700 ${fs}px ${FONT}`}
    const sh=(NOW*300)%1400-200,gg=g.createLinearGradient(sh,0,sh+260,0);gg.addColorStop(0,'#ffcc33');gg.addColorStop(.5,'#fff8d0');gg.addColorStop(1,'#ffcc33');txt(nm,540,990,fs,gg,'center',700,'rgba(80,30,0,.95)');
    if(P0.coins){drawImg(P0.icon,470,1066,64);txt(`${P0.coins} เหรียญ`,520,1080,34,'#fff0c0','left',700)}g.restore();g.globalAlpha=1}
  else{coinsFx.length=0;const a=clamp((24-t)*2,0,1);g.globalAlpha=a;const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'rgba(160,20,20,0)');gr.addColorStop(.15,'rgba(160,20,20,.92)');gr.addColorStop(.85,'rgba(160,20,20,.92)');gr.addColorStop(1,'rgba(160,20,20,0)');g.fillStyle=gr;g.fillRect(0,404,W,62);
    g.fillStyle='#ffd04a';g.fillRect(140,404,800,3);g.fillRect(140,463,800,3);avatar(p,250,435,24,'#ffd04a');txt(`${P0.title}  คุณ${short(p.name,12)}`,288,446,30,'#ffe066','left',700);g.globalAlpha=1}
}
function drawOverlay(){g.clearRect(0,0,W,H);
  drawTags();
  hearts=hearts.filter(h=>NOW-h.t<1);for(const h of hearts){const k=NOW-h.t,kn=h.p.kn;if(!kn)continue;const s=toScreen(kn.g.position.clone().add(V3(0,1.4,0)));g.globalAlpha=1-k;leaf(s.x+Math.sin(h.t*40)*20,s.y-30-k*60,16+k*6);g.globalAlpha=1}
  hud();drawSupporters();drawLeafTop();drawNames();drawParadeIntro();
  toasts=toasts.filter(x=>NOW-x.t<6);if(toasts.length){const s='ยินดีต้อนรับ   '+toasts.slice(-3).map(x=>short(x.name,10)).join('  ·  ');g.font=`700 26px ${FONT}`;const w=Math.min(1040,g.measureText(s).width+60),a=clamp((6-(NOW-toasts[toasts.length-1].t))*2,0,1);
    g.globalAlpha=a;g.fillStyle='rgba(70,24,6,.86)';g.beginPath();g.roundRect(540-w/2,SAFE_T+336,w,46,23);g.fill();g.strokeStyle='#ffd27a';g.lineWidth=2;g.stroke();txt(s,540,SAFE_T+369,26,'#ffe9c0','center',700);g.globalAlpha=1}
  pops=pops.filter(p=>NOW-p.t<1.8);for(const p of pops){const k=(NOW-p.t)/1.8,kn=p.p.kn;const s=kn?toScreen(kn.g.position.clone().add(V3(0,1.6,0))):{x:540,y:1000};g.globalAlpha=1-k*k;if(p.img)drawImg(p.img,s.x,s.y-110-k*60,64);txt(p.s,s.x,s.y-62-k*60,26,'#ffe08a','center');g.globalAlpha=1}
  // ชื่อองค์ใหม่
  if(title){const t=NOW-title.t;if(t>5)title=null;else{const a=clamp(Math.min(t*3,(5-t)*2),0,1),k=ease.back(Math.min(1,t/.4));g.globalAlpha=a;g.save();g.translate(540,640);g.scale(k,k);g.translate(-540,-640);
    const sp=STAT_SP,hh=title.tier>=0?250:200,yy=640-hh/2;panel(110,yy,860,hh,'#ffd27a',.82);let y=yy+56;if(title.tier>=0){txt(`ขั้นที่ ${title.tier+1}  ${TIER[title.tier].n}`,540,y,30,'#ffb070','center',700);y+=56}
    txt(`องค์ที่ ${curIdx+1} / 20`,540,y,48,'#ffd27a','center',700);txt(sp.n,540,y+52,34,'#fff','center',700);txt(`สูง ${Math.round(sp.h)} เมตร  ใช้ทอง ${need(curIdx).toLocaleString()} แผ่น`,540,y+92,24,'#ffe2b0','center',600);g.restore();g.globalAlpha=1}}
  // ปิดทองครบ: ขอบคุณรายชื่อ
  if(credit){const t=NOW-credit.t;if(t>9)credit=null;else{const a=clamp(Math.min(t*2,(9-t)*2),0,1);g.globalAlpha=a;panel(80,1110,920,230,'#ffd27a',.86);
    txt('ปิดทองครบแล้ว',540,1170,52,'#ffd04a','center',700);txt(`องค์ที่ ${credit.i+1}  ${STATUES[credit.i].n}`,540,1216,28,'#fff','center',600);
    txt(credit.names.length?'ขอบคุณ  '+credit.names.join('  ·  '):'ขอบคุณทุกท่านที่ร่วมกัน',540,1264,24,'#ffe2b0','center',600);txt(`ร่วมกัน ${credit.n} ท่าน`,540,1306,22,'#ffd9a0','center',600);g.globalAlpha=1}}
  if(PARADE&&NOW-PARADE.t0<4.7)cards.forEach(c=>{if(c.t<=NOW)c.t=PARADE.t0+4.8});
  cards=cards.filter(c=>NOW<c.t+cardDur(c));const cd=cards.find(c=>NOW>=c.t);
  if(cd)drawCard(cd);
  
  if(fade>0){g.fillStyle=`rgba(255,236,190,${fade})`;g.fillRect(0,0,W,H)}
  if(SND.ctx&&SND.ctx.state!=='running'){g.fillStyle='rgba(14,16,20,.8)';g.beginPath();g.roundRect(290,1846,500,52,26);g.fill();txt('คลิกจอ 1 ครั้ง เพื่อเปิดเสียง',540,1882,28,'#ffd27a','center',600)}
  if((TEST||Q.has('fps'))&&fpsNow){g.fillStyle='rgba(14,16,20,.75)';g.beginPath();g.roundRect(W-250,1400,234,44,12);g.fill();txt(`${Math.round(fpsNow)} เฟรม/วิ${quality?'  ลดภาพ '+quality:''}`,W-133,1431,24,fpsNow>=50?'#9fe08a':fpsNow>=34?'#ffd04a':'#ff6a6a','center',600)}
  if(SHOWSAFE){g.fillStyle='rgba(255,0,0,.25)';g.fillRect(0,0,W,SAFE_T);g.fillRect(0,SAFE_B,W,H-SAFE_B)}}

// ---------- ฉากเคลื่อนไหว ----------
function updScene(dt){T.value=NOW;updKneelers(dt);updFlakes();updPetals(dt);updFw();updParade(dt);
  for(const f of flames){const k=.8+.2*Math.sin(NOW*13+f.p)+.08*Math.sin(NOW*31+f.p*2);f.s.scale.set(f.b*k,f.b*k*1.3,1)}
  for(const r of REDS){r.cloth.rotation.y=Math.sin(NOW*1.3+r.ph)*.18}
  if(stars)stars.material.opacity=.75+.2*Math.sin(NOW*.7);
  if(STAT_SP&&STAT_SP.stars&&phase!=='fade'){ambFw-=dt;if(ambFw<0){ambFw=rnd(7,13);fireworks(2,400)}}
  bellT-=dt;if(bellT<0){bellT=rnd(45,80);bell(.22,rnd(180,240))}}
// ---------- คำสั่งจากหน้า /control ----------
const NPC={level:1};
function control(c){const a=c.arg;
  if(c.cmd==='finish'){const l=leftNow();if(l>0&&phase==='gild')addGold(null,l)}
  else if(c.cmd==='parade')parade({name:'ทุกท่าน'},'ขบวนแห่ฉลอง');
  else if(c.cmd==='fireworks')fireworks(8);
  else if(c.cmd==='say'&&a&&clean(a))mcSay(String(a).slice(0,150),{pri:1,chime:1,ttl:60});
  else if(c.cmd==='reload')location.reload();
  else if(c.cmd==='musvol'){MUS.vol=clamp(+a||0,0,1);if(MUS.bus)MUS.bus.gain.value=MUS.vol}
  else if(c.cmd==='mc')CFG.mc=+a?1:0;else if(c.cmd==='welcome')CFG.welcome=+a?1:0;else if(c.cmd==='mcgap')CFG.gap=clamp(+a||15,5,120);
  else if(c.cmd==='goal'){CFG.goal=clamp(+a||1,.25,4)}}
let wsRef=null;
function sendState(){if(!wsRef||wsRef.readyState!==1)return;wsRef.send(JSON.stringify({type:'state',game:'temple',state:phase,statue:`${curIdx+1}/20`,gold:Math.round(progNow()*need(curIdx)),need:need(curIdx),total:TOTAL,
  players:Object.values(PL).filter(p=>NOW-p.last<60).length,top:topList()[0]?topList()[0].name+' '+topList()[0].coins+' เหรียญ':'-',hearts:liveHearts,parade:PARADE?1+paradeQ.length:paradeQ.length,fps:Math.round(fpsNow),quality,live:live.state,audio:SND.ctx?SND.ctx.state:'none',mcSaid:MC.said||0,mcBusy:MC.busy?1:0,mcQ:MC.q.length}))}
setInterval(sendState,1000);

// ---------- คนดูจำลอง / โหมดทดสอบ ----------
const FAKE=['ploy_99','mek.k','nongbeam','jaa_jaa','tonkla','minnie.th','pond2002','fern.f'],FAKE2=['somchai','น้องมายด์','beer_bkk','kwankwan','aomsin','พี่ต้น','nutty','น้องฟ้า'];
const SAMPLE=['ขอให้พ่อแม่สุขภาพแข็งแรง','ครอบครัวสมใจ','ขอให้ทุกคนปลอดภัย','แม่มาลี พ่อสมชาย','ขอให้สอบผ่าน','ยายบุญมี','ขอให้งานราบรื่น','ทุกคนในบ้าน'];
let simT={c:1,l:0,g:12,j:3},crowdOn=Q.has('demo');
function sim(){const act=Object.values(PL).filter(p=>NOW-p.last<25);if(NOW>simT.c){simT.c=NOW+rnd(2,5);comment(pick(FAKE),pick(SAMPLE))}if(NOW>simT.j){simT.j=NOW+rnd(6,11);joined(pick(FAKE2))}
  if(NOW>simT.l){simT.l=NOW+.4;if(act.length&&Math.random()<.8)like(pick(act).name,rnd(1,8)|0)}if(NOW>simT.g){simT.g=NOW+rnd(12,20);if(act.length)gift(pick(act).name,pick([1,1,5,5,30,100,299]))}}
function joined(name,pic){if(!name||!clean(name))return;player(name,pic);welcome(name)}
if(TEST){const me='ผู้ทดสอบ',bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.92);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 15px Kanit,Tahoma;z-index:9';
  const btn=(l,fn,bg='#3a3f48')=>{const b=document.createElement('button');b.textContent=l;b.style.cssText=`background:${bg};color:#fff;border:0;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer`;b.onclick=e=>{e.stopPropagation();SND.ctx&&SND.ctx.resume();fn()};bar.appendChild(b);return b};
  const inp=document.createElement('input');inp.value='พ่อสมชาย แม่มาลี';inp.maxLength=34;inp.style.cssText='font:inherit;padding:7px 9px;border-radius:8px;border:0;width:180px';inp.onpointerdown=e=>e.stopPropagation();inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')comment(me,inp.value)};bar.appendChild(inp);
  btn('พิมพ์ชื่อ',()=>comment(me,inp.value),'#4a6a3a');btn('หัวใจ 1',()=>like(me,1),'#a83a5a');btn('หัวใจ 10',()=>like(me,10),'#a83a5a');btn('หัวใจ 100',()=>{for(let i=0;i<10;i++)setTimeout(()=>like(me,10),i*120)},'#a83a5a');
  btn('กุหลาบ 1',()=>gift(me,1,'5655'),'#8a5a2a');btn('5 เหรียญ',()=>gift(me,5,'919386'),'#8a5a2a');btn('โดนัท 30',()=>gift(me,30,'5879'),'#8a5a2a');btn('มือหัวใจ 100',()=>gift(me,100,'5660'),'#8a5a2a');btn('คอร์กี้ 299',()=>gift(me,299,'6267'),'#8a5a2a');
  btn('กดติดตาม',()=>{followDone.delete(me);follow(me)},'#c0394b');btn('ปิดทองครบองค์นี้',()=>control({cmd:'finish'}),'#7a5a1a');btn('คนเข้าห้อง',()=>joined(pick(FAKE2)+' '+(greeted.size+1)),'#3a5a7a');
  const cb=btn('คนดูจำลอง: ปิด',()=>{crowdOn=!crowdOn;cb.textContent='คนดูจำลอง: '+(crowdOn?'เปิด':'ปิด')},'#3a5a7a');document.body.appendChild(bar)}
Object.assign(window,{comment,like,gift,follow,parade,fireworks,control,PL,_dev:{scene,camera,renderer,STATUES,setStatue},st:()=>({phase,curIdx,TOTAL,prog:progNow(),fl:FL.length})});

// ---------- ข้อมูลจริงจาก server.js ----------
const ids={},used={};
function nameFor(id,name){if(ids[id])return ids[id];let n=clean(name)?name:'ผู้ใช้',i=2;const base=n;while(used[n]&&used[n]!==id)n=`${base}${i++}`;used[n]=id;return ids[id]=n}
function onLive(ev){if(ev.type==='status'){live={...live,...ev};return}if(ev.type==='control'){control(ev);return}const name=ev.id?nameFor(ev.id,ev.name):ev.name;
  if(ev.type==='chat')comment(name,ev.text,ev.pic);else if(ev.type==='like')like(name,ev.count||1,ev.pic);else if(ev.type==='gift')gift(name,ev.coins||1,ev.giftId,ev.img,ev.pic);else if(ev.type==='follow')follow(name,ev.pic,ev.repeat);else if(ev.type==='join')joined(name,ev.pic)}
if(!DEMO){let wsT=0;const open=()=>{const ws=new WebSocket(`ws://${location.host}/ws`);wsRef=ws;ws.onmessage=m=>{try{onLive(JSON.parse(m.data))}catch(e){console.error(e)}};ws.onclose=()=>{live.state='server';clearTimeout(wsT);wsT=setTimeout(open,2000)}};open()}

// ---------- loop ----------
const composer=new EffectComposer(renderer);composer.setSize(W,H);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),.3,.4,.9);composer.addPass(bloom);composer.addPass(new OutputPass());
let last=performance.now(),errN=0,fpsN=0,fpsT0=performance.now(),quality=0,fpsNow=0,lowN=0;
function fpsGuard(){fpsN++;const now=performance.now();if(now-fpsT0<2000)return;fpsNow=fpsN*1000/(now-fpsT0);fpsN=0;fpsT0=now;
  if(PARADE||NOW<10||document.visibilityState!=='visible'){lowN=0;return}lowN=fpsNow<34?lowN+1:0;
  if(lowN>=3&&quality<2){lowN=0;quality++;if(quality===1){renderer.setPixelRatio(.75);composer.setPixelRatio(.75)}else{bloom.enabled=false;renderer.shadowMap.enabled=false}console.log('ลดคุณภาพภาพระดับ '+quality)}}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;NOW+=dt;
  try{if(crowdOn)sim();mcIdle(dt);updPhase(dt);updCamera();updScene(dt);musicTick();fpsGuard();renderer.info.reset();composer.render();drawOverlay()}catch(e){if(errN++<5)console.error(e)}}
async function start(){if(!DEMO){try{const r=await fetch('/record/temple',{cache:'no-store'});const d=await r.json();TOTAL=saved=Math.max(0,d.best|0)}catch(e){}}
  if(Q.has('statue')){const n=clamp((+Q.get('statue')|0)-1,0,19);TOTAL=prefix(n)+Math.round(need(n)*clamp(+(Q.get('gold')||0),0,.99))}
  locate();setStatue(curIdx);phase='intro';phaseT=NOW;title={t:NOW,tier:STAT_SP.t};visProg=progNow();
  mcSay(`ยินดีต้อนรับสู่งานร่วมปิดทองพระครับ ตอนนี้เราอยู่องค์ที่ ${curIdx+1} ${STAT_SP.n}ครับ`,{chime:1,ttl:30});
  last=performance.now();requestAnimationFrame(loop)}
document.fonts.load('700 40px Kanit').finally(start);
</script></body></html>
